<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>OWAC · 研究统筹台</title>
<style>
/* ============================================================
   OWAC 研究统筹台 · 呈现层
   设计契约：outputs/research-hub/design-contract.md (v1.0)
   测试锚点：outputs/research-hub/dom-contract.md
   零外部依赖：无 @import / @font-face / 外链资源。
   ============================================================ */

/* ---------- C.2 设计令牌 ---------- */
:root{
  /* 面 */
  --c-canvas:#F6F7F4; --c-surface:#FFFFFF; --c-surface-2:#FAFBF8; --c-sunken:#F1F2EE;
  /* 线 */
  --c-line:#E4E7E0; --c-line-strong:#828D85; --c-line-focus:#2F6B4F;
  /* 字 */
  --c-text:#1E2A25; --c-text-2:#5A6660; --c-text-3:#67736C; --c-text-invert:#FFFFFF;
  /* 状态 */
  --c-warn-bg:#FDF6E7; --c-warn-text:#7A5A1E; --c-warn-line:#EFDFC0;
  --c-danger:#A03A2E; --c-danger-bg:#FCEEEC; --c-danger-line:#F0CFC9;
  --c-focus:#2F6B4F; --focus-ring:0 0 0 2px var(--c-canvas),0 0 0 4px var(--c-focus);
  /* 路线 */
  --route-green:#1F6A4A; --route-green-soft:#E8F1EC; --route-green-line:#C9E0D4; --route-green-ink:#17513A;
  --route-blue:#3B6390;  --route-blue-soft:#E9EFF7;  --route-blue-line:#CBDAEB;  --route-blue-ink:#2C4C72;
  --route-orange:#8F6231;--route-orange-soft:#F6EEE3;--route-orange-line:#E7D6BF;--route-orange-ink:#6F4B22;
  /* 字阶（size/line-height） */
  --fs-display:30px; --lh-display:38px;
  --fs-h1:22px;      --lh-h1:30px;
  --fs-h2:17px;      --lh-h2:26px;
  --fs-h3:15px;      --lh-h3:24px;
  --fs-body:14px;    --lh-body:22px;
  --fs-sm:13px;      --lh-sm:20px;
  --fs-xs:12px;      --lh-xs:18px;
  --fs-mono:12.5px;  --lh-mono:20px;
  /* 字重 */
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:650;
  /* 间距 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --sp-7:28px; --sp-8:32px; --sp-10:40px; --sp-12:48px; --sp-16:64px;
  /* 圆角 */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  /* 阴影 */
  --sh-1:0 1px 1px rgba(24,34,29,.03),0 1px 3px rgba(24,34,29,.04);
  --sh-2:0 2px 6px rgba(24,34,29,.06),0 1px 2px rgba(24,34,29,.04);
  --sh-3:0 8px 24px rgba(24,34,29,.10),0 2px 6px rgba(24,34,29,.06);
  --sh-4:0 16px 48px rgba(24,34,29,.14),0 4px 12px rgba(24,34,29,.08);
  --sh-5:0 24px 64px rgba(24,34,29,.18);
  /* 动效 */
  --dur-1:90ms; --dur-2:140ms; --dur-3:200ms; --dur-4:240ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.4,0,.2,1);
  /* 层级 */
  --z-base:0; --z-sticky:100; --z-context:90; --z-scrim:200; --z-drawer:210; --z-palette:300; --z-toast:400;
  /* 尺寸 */
  --h-control:34px; --h-control-sm:28px; --h-control-lg:40px; --hit-coarse:44px;
  --w-drawer:560px; --w-drawer-xl:640px; --w-palette:640px;
  /* C.1 兼容别名 */
  --paper:var(--c-canvas); --white:var(--c-surface); --ink:var(--c-text); --muted:var(--c-text-2);
  --line:var(--c-line); --green:var(--route-green); --green-soft:var(--route-green-soft);
  --blue:var(--route-blue); --blue-soft:var(--route-blue-soft);
  --orange:var(--route-orange); --orange-soft:var(--route-orange-soft);
}
@media (pointer:coarse){
  :root{ --h-control:44px; --h-control-sm:44px; --h-control-lg:44px; }
  input,select,textarea{ font-size:16px !important; }
  .ws-tab,.btn,.iconbtn,.segment,.subtab,.stage-node,.docrow,summary,.p-opt,.docchip,.disclosure-toggle,
  .prompt-opt,.pgroup-toggle,.qchip button{ min-height:var(--hit-coarse); }
  .iconbtn,.qchip button,.ws-tab,.subtab,.segment,.btn{ min-width:var(--hit-coarse); }
  .skip-link{ display:inline-flex; align-items:center; min-height:var(--hit-coarse); }
}

/* ---------- 基础 ---------- */
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--c-canvas); color:var(--c-text);
  font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--sans,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif);
}
html{ --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
      --mono:ui-monospace,SFMono-Regular,Consolas,monospace; }
h1,h2,h3,h4,p,ol,ul,figure{ margin:0; }
ol,ul{ padding:0; list-style:none; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; text-align:left; }
a{ color:var(--route-green); text-decoration:none; }
a:hover{ text-decoration:underline; }
[hidden]{ display:none !important; }
.mono{ font-family:var(--mono); font-size:var(--fs-mono); line-height:var(--lh-mono); }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.skip-link{
  position:absolute; left:var(--sp-4); top:-48px; z-index:calc(var(--z-toast) + 1);
  background:var(--c-surface); color:var(--c-text); border:1px solid var(--c-line-strong);
  border-radius:var(--r-sm); padding:8px 12px; box-shadow:var(--sh-2);
  transition:top var(--dur-2) var(--ease-out);
}
.skip-link:focus{ top:var(--sp-2); }

:focus-visible{
  outline:2px solid var(--c-focus) !important;
  outline-offset:2px;
  box-shadow:var(--focus-ring) !important;
}

/* ---------- D.1 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:var(--z-sticky); height:56px;
  display:flex; align-items:center; gap:var(--sp-5);
  padding:0 var(--sp-8); background:var(--c-surface); border-bottom:1px solid var(--c-line);
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark{ display:grid; grid-template-columns:1fr 1fr; gap:2px; width:20px; height:20px; flex:none; }
.brand-mark i{ display:block; border-radius:2px; background:var(--route-green); }
.brand-mark i:nth-child(2){ background:var(--route-blue); }
.brand-mark i:nth-child(3){ background:var(--route-orange); opacity:.9; }
.brand-mark i:nth-child(4){ background:var(--c-text); opacity:.75; }
.brand strong{ display:block; font-size:15px; font-weight:var(--fw-bold); letter-spacing:.01em; white-space:nowrap; }
.brand small{ display:block; font-size:10px; letter-spacing:.14em; color:var(--c-text-3); font-weight:var(--fw-medium); }
.ws-tabs{ display:flex; gap:2px; margin-left:var(--sp-2); }
.ws-tab{
  position:relative; height:32px; padding:0 var(--sp-3); border-radius:var(--r-sm);
  color:var(--c-text-2); font-size:var(--fs-body); font-weight:var(--fw-medium);
  display:inline-flex; align-items:center; gap:6px;
}
.ws-tab:hover{ background:var(--c-sunken); color:var(--c-text); }
.ws-tab[aria-selected="true"]{ background:var(--c-sunken); color:var(--c-text); font-weight:var(--fw-semibold); }
.ws-tab[aria-selected="true"]::after{
  content:""; position:absolute; left:var(--sp-3); right:var(--sp-3); top:0; height:2px; background:var(--c-text);
}
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:var(--sp-2); }
.sync-status{ display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--c-text-2); white-space:nowrap; }
.sync-status .sync-dot{ width:8px; height:8px; border-radius:50%; background:var(--c-text-3); flex:none; }
.sync-status[data-state="idle"] .sync-dot{ background:var(--route-green); }
.sync-status[data-state="loading"] .sync-dot{ background:var(--c-warn-text); }
.sync-status[data-state="ok"] .sync-dot{ background:var(--route-green); }
.sync-status[data-state="error"]{ color:var(--c-danger); }
.sync-status[data-state="error"] .sync-dot{ background:var(--c-danger); }
.searchbtn{
  display:inline-flex; align-items:center; gap:var(--sp-2); height:var(--h-control); width:320px; padding:0 var(--sp-3);
  border:1px solid var(--c-line-strong); border-radius:var(--r-sm); background:var(--c-surface);
  color:var(--c-text-3); font-size:var(--fs-sm);
  transition:background var(--dur-1) var(--ease-out);
}
.searchbtn:hover{ background:var(--c-surface-2); }
.searchbtn kbd{
  margin-left:auto; font:var(--fw-medium) 11px/1 var(--mono); color:var(--c-text-2);
  background:var(--c-sunken); border:1px solid var(--c-line); border-radius:var(--r-xs); padding:3px 5px;
}

/* ---------- D.9 按钮 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:var(--h-control); padding:0 var(--sp-3); border-radius:var(--r-sm);
  font-size:var(--fs-sm); font-weight:var(--fw-medium); border:1px solid transparent; white-space:nowrap;
  transition:background var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out);
}
.btn-primary{ background:var(--route-green); color:var(--c-text-invert); }
.btn-primary:hover{ background:#1A5C40; }
.btn-primary:active{ background:#164D36; }
.btn-secondary{ background:var(--c-surface); border-color:var(--c-line-strong); color:var(--c-text); }
.btn-secondary:hover{ background:var(--c-surface-2); }
.btn-ghost{ color:var(--c-text-2); }
.btn-ghost:hover{ background:var(--c-sunken); color:var(--c-text); }
.btn-danger{ color:var(--c-danger); }
.btn-danger:hover{ background:var(--c-danger-bg); }
.btn-sm{ height:var(--h-control-sm); font-size:var(--fs-xs); padding:0 10px; }
.btn-link{ color:var(--c-text); text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--c-line-strong); }
.btn[disabled],.btn[aria-disabled="true"]{ opacity:.55; cursor:not-allowed; }
.iconbtn{
  width:var(--h-control); height:var(--h-control); display:inline-flex; align-items:center; justify-content:center;
  border-radius:var(--r-sm); color:var(--c-text-2);
  transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
}
.iconbtn:hover{ background:var(--c-sunken); color:var(--c-text); }
.refresh-btn[data-state="loading"] .refresh-icon{ display:inline-block; animation:spin var(--dur-4) linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- 徽标 / 状态点 ---------- */
.badge{
  display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px; border-radius:var(--r-pill);
  font-size:var(--fs-xs); font-weight:var(--fw-medium); border:1px solid transparent; white-space:nowrap;
}
.badge-green{ background:var(--route-green-soft); color:var(--route-green-ink); border-color:var(--route-green-line); }
.badge-blue{ background:var(--route-blue-soft); color:var(--route-blue-ink); border-color:var(--route-blue-line); }
.badge-orange{ background:var(--route-orange-soft); color:var(--route-orange-ink); border-color:var(--route-orange-line); }
.badge-warn{ background:var(--c-warn-bg); color:var(--c-warn-text); border-color:var(--c-warn-line); }
.badge-neutral{ background:var(--c-sunken); color:var(--c-text-2); border-color:var(--c-line); }
.dot{ width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; background:var(--c-line-strong); }
.dot-green{ background:var(--route-green); } .dot-blue{ background:var(--route-blue); } .dot-orange{ background:var(--route-orange); }
.kbd{ font:var(--fw-medium) 11px/1 var(--mono); color:var(--c-text-2); background:var(--c-sunken); border:1px solid var(--c-line); border-radius:var(--r-xs); padding:3px 5px; }

/* ---------- D.2 上下文栏 ---------- */
.contextbar{
  position:sticky; top:56px; z-index:var(--z-context); min-height:48px;
  display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap;
  padding:6px var(--sp-8); background:var(--c-canvas); border-bottom:1px solid var(--c-line);
}
.switch{ display:flex; gap:2px; padding:2px; background:var(--c-sunken); border-radius:var(--r-md); }
.segment{
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 var(--sp-3); border-radius:var(--r-sm);
  color:var(--c-text-2); font-size:var(--fs-sm);
  transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
}
.segment:hover{ color:var(--c-text); }
.segment[aria-selected="true"]{ background:var(--c-surface); color:var(--c-text); font-weight:var(--fw-semibold); box-shadow:var(--sh-1); }
.segment .id{ font-weight:var(--fw-semibold); font-size:var(--fs-xs); }
.segment[data-route-color="green"] .id{ color:var(--route-green); }
.segment[data-route-color="blue"] .id{ color:var(--route-blue); }
.segment[data-route-color="orange"] .id{ color:var(--route-orange); }
.segment .route-name{ color:var(--c-text-2); font-weight:var(--fw-regular); }
.subtabs{ display:flex; gap:var(--sp-5); }
.subtab{
  position:relative; height:32px; display:inline-flex; align-items:center; color:var(--c-text-2); font-size:var(--fs-sm);
  transition:color var(--dur-1) var(--ease-out);
}
.subtab:hover{ color:var(--c-text); }
.subtab[aria-selected="true"]{ color:var(--c-text); font-weight:var(--fw-semibold); }
.subtab[aria-selected="true"]::after{ content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; background:var(--c-text); }
.ctx-right{ margin-left:auto; display:flex; align-items:center; gap:var(--sp-3); }

/* ---------- 主区 / 页头 / 状态条 / 提示条 ---------- */
.main{ max-width:1240px; margin:0 auto; padding:var(--sp-8) var(--sp-8) var(--sp-16); }
.section{ margin-bottom:var(--sp-8); }
.pagehead{ display:flex; align-items:flex-start; gap:var(--sp-6); margin-bottom:var(--sp-4); }
.pagehead h1{ font-size:var(--fs-display); line-height:var(--lh-display); font-weight:var(--fw-bold); letter-spacing:-.02em; }
.pagehead p{ margin-top:6px; font-size:var(--fs-sm); color:var(--c-text-2); max-width:62ch; }
.pagehead .actions{ margin-left:auto; display:flex; gap:var(--sp-2); padding-top:6px; }
.statusbar{
  display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap;
  font-size:var(--fs-sm); color:var(--c-text-2); padding:10px 0;
  border-top:1px solid var(--c-line); border-bottom:1px solid var(--c-line); margin-bottom:var(--sp-5);
}
.statusbar .sep{ color:var(--c-line-strong); }
.notice{
  display:flex; align-items:center; gap:10px; min-height:40px; padding:8px var(--sp-4);
  background:var(--c-warn-bg); border-left:3px solid var(--c-warn-line); border-radius:var(--r-sm);
  color:var(--c-warn-text); font-size:var(--fs-sm); margin-bottom:var(--sp-5);
}
.notice .close{ margin-left:auto; color:var(--c-warn-text); opacity:.7; }
.notice .close:hover{ opacity:1; }
.notice-danger{ background:var(--c-danger-bg); border-left-color:var(--c-danger-line); color:var(--c-danger); }

/* ---------- D.3 路线卡 ---------- */
.route-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--sp-6); align-items:stretch; }
.route-card{
  position:relative; display:flex; flex-direction:column; min-width:0;
  background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--r-lg);
  box-shadow:var(--sh-1); padding:var(--sp-5); overflow:hidden;
  transition:box-shadow var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out);
}
.route-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--route,var(--route-green)); }
.route-card:hover{ box-shadow:var(--sh-2); transform:translateY(-1px); }
.route-card[data-missing="true"]{ opacity:.6; }
.route-card .rc-top{ display:flex; align-items:center; gap:var(--sp-2); }
.route-card .rc-id{ font-size:var(--fs-xs); font-weight:var(--fw-semibold); letter-spacing:.06em; color:var(--route,var(--route-green)); }
.route-card h2{ font-size:var(--fs-h2); line-height:var(--lh-h2); font-weight:var(--fw-semibold); margin-top:6px; }
.route-card .rc-top .badge{ margin-left:auto; }
.route-card .rc-tag{ margin-top:2px; font-size:var(--fs-sm); color:var(--c-text-2); }
.route-card .rc-next{ margin-top:var(--sp-3); font-size:var(--fs-sm); color:var(--c-text); }
.route-card .rc-next span{ color:var(--c-text-3); }
.route-card .rc-sum{
  margin-top:var(--sp-3); font-size:var(--fs-sm); color:var(--c-text-2);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.route-card .rc-sum[data-open="true"]{ display:block; }
.route-card .rc-more{ margin-top:6px; font-size:var(--fs-xs); color:var(--c-text-2); }
.route-card .rc-more:hover{ color:var(--c-text); }
.route-card .rc-meta{ margin-top:6px; font-size:var(--fs-xs); color:var(--c-text-3); }
.route-card .rc-actions{ display:flex; gap:var(--sp-2); margin-top:auto; padding-top:var(--sp-4); }
.route-card .rc-actions .btn-primary{ flex:1; }

/* ---------- 折叠区 ---------- */
.strategy-hero{padding:24px;border:1px solid var(--route-green-line);border-radius:var(--r-lg);background:var(--c-surface);margin-bottom:28px;}
.strategy-hero h2{font-size:25px;line-height:1.45;margin:10px 0 8px;}
.strategy-hero p{color:var(--c-text-2);max-width:88ch;}
.strategy-facts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;}
.strategy-facts span{padding:5px 10px;border-radius:6px;background:var(--route-green-soft);color:var(--route-green-ink);font-size:12px;}
.strategy-hero .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.strategy-boundary{margin-top:14px;font-size:12px;}
.lineage-panel{border:1px solid var(--c-line);border-radius:12px;background:var(--c-surface);overflow:hidden;margin:24px 0;}
.lineage-head{padding:20px 20px 10px;}
.lineage-head h2{font-size:20px;line-height:1.5;}
.lineage-head p{font-size:13px;color:var(--c-text-2);margin-top:6px;}
.lineage-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;}
.lineage-tools button[aria-pressed="true"]{background:var(--route-green-soft);border-color:var(--route-green-line);color:var(--route-green-ink);}
.lineage-scroll{overflow:auto;padding:0 4px 8px;overscroll-behavior-x:contain;}
.lineage-canvas{position:relative;isolation:isolate;}
.lineage-canvas svg{position:absolute;inset:0;pointer-events:none;z-index:-1;}
.lineage-edge{fill:none;stroke:#A0ABA3;stroke-width:1.6;}
.lineage-edge[data-kind="conditional"]{stroke-dasharray:6 5;}
.lineage-edge[data-selected="true"]{stroke:var(--route-green);stroke-width:2.4;}
.lineage-column{position:absolute;top:12px;text-align:center;font-size:11px;color:var(--c-text-3);letter-spacing:.02em;}
.lineage-node{position:absolute;height:126px;padding:12px;background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:9px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--sh-1);}
.lineage-node small{font-size:11px;color:var(--c-text-3);}
.lineage-node strong{font-size:13px;line-height:20px;}
.lineage-node span{font-size:11px;line-height:17px;color:var(--c-text-2);}
.lineage-node[data-state="paused"]{border-top:3px solid var(--route-orange-line);}
.lineage-node[data-state="current"]{background:var(--route-green-soft);border-color:var(--route-green-line);}
.lineage-node[data-state="planned"]{border-style:dashed;}
.lineage-node[aria-pressed="true"]{outline:2px solid var(--route-green);outline-offset:2px;}
.lineage-detail{border-top:1px solid var(--c-line);padding:18px 20px;background:var(--c-surface-2);}
.lineage-detail h3{font-size:16px;line-height:24px;margin:6px 0;}
.lineage-detail p{font-size:13px;color:var(--c-text-2);max-width:95ch;}
.lineage-detail .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
@media(max-width:600px){.strategy-hero{padding:18px;}.strategy-hero h2{font-size:22px;}.lineage-head,.lineage-detail{padding:16px;}.strategy-hero .actions .btn{flex:1 1 140px;justify-content:center;}}

.disclosure{
  border:1px solid var(--c-line); border-radius:var(--r-lg); background:var(--c-surface);
  box-shadow:var(--sh-1); margin-bottom:var(--sp-3);
}
.disclosure-toggle{
  display:flex; align-items:center; gap:var(--sp-2); width:100%; padding:14px var(--sp-5);
  font-size:var(--fs-h3); font-weight:var(--fw-semibold); border-radius:var(--r-lg);
}
.disclosure-toggle .chev{ margin-left:auto; color:var(--c-text-3); font-size:var(--fs-sm); }
.disclosure-toggle .count{ font-size:var(--fs-xs); font-weight:var(--fw-regular); color:var(--c-text-3); }
.disclosure-body{ padding:var(--sp-4) var(--sp-5) var(--sp-5); border-top:1px solid var(--c-line); }
.disclosure[data-open="true"] .disclosure-toggle .chev{ transform:rotate(180deg); }
.docchip{ display:flex; align-items:center; gap:var(--sp-2); padding:10px 0; border-bottom:1px solid var(--c-line); font-size:var(--fs-sm); width:100%; }
.docchip:last-child{ border-bottom:0; }
.docchip .path{ font:var(--fw-regular) var(--fs-mono)/var(--lh-mono) var(--mono); color:var(--c-text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.docchip .grow{ margin-left:auto; color:var(--c-text-3); }
.meta-list{ display:grid; grid-template-columns:120px minmax(0,1fr); gap:6px var(--sp-4); font-size:var(--fs-sm); }
.meta-list dt{ color:var(--c-text-3); }
.meta-list dd{ margin:0; font-family:var(--mono); font-size:var(--fs-mono); color:var(--c-text-2); word-break:break-all; }
.rule-list{ font-size:var(--fs-sm); color:var(--c-text-2); }
.rule-list li{ padding:6px 0 6px 22px; position:relative; }
.rule-list li::before{ content:""; position:absolute; left:6px; top:14px; width:5px; height:5px; border-radius:50%; background:var(--c-line-strong); }

/* ---------- D.4 阶段条 / D.5 阶段详情 ---------- */
.strip{ display:flex; gap:var(--sp-2); overflow-x:auto; padding:2px 2px var(--sp-2); }
.stage-node{
  position:relative; flex:none; min-width:120px; min-height:72px; padding:10px var(--sp-3);
  border:1px solid var(--c-line); border-radius:var(--r-md); background:transparent;
  display:flex; flex-direction:column; gap:4px; text-align:left;
  transition:background var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out);
}
.stage-node:hover{ background:var(--c-sunken); }
.stage-node[aria-selected="true"]{
  background:var(--c-surface); border-color:var(--route-line,var(--route-green-line)); box-shadow:var(--sh-1);
}
.stage-node[aria-selected="true"]::before{ content:""; position:absolute; left:8px; right:8px; top:0; height:2px; background:var(--route,var(--route-green)); }
.stage-node .sn-id{ display:flex; align-items:center; gap:5px; font-size:var(--fs-xs); font-weight:var(--fw-semibold); }
.stage-node .sn-title{ font-size:var(--fs-sm); color:var(--c-text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stage-node .sn-state{ font-size:11px; color:var(--c-text-3); }
.stage-node[data-state="recorded"] .sn-id{ color:var(--route-green); }
.stage-node[data-state="current"] .sn-id{ color:var(--c-text); }
.stage-node[data-state="blocked"] .sn-id{ color:var(--c-warn-text); }
.detail{
  margin-top:var(--sp-4); background:var(--c-surface); border:1px solid var(--c-line);
  border-radius:var(--r-lg); box-shadow:var(--sh-1); padding:var(--sp-5);
}
.detail .dt-top{ display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; }
.detail h2{ font-size:var(--fs-h3); line-height:var(--lh-h3); font-weight:var(--fw-semibold); }
.detail .dt-desc{
  margin-top:var(--sp-3); font-size:var(--fs-body); color:var(--c-text-2);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.detail .dt-desc[data-open="true"]{ display:block; }
.detail .dt-src{ display:flex; align-items:center; gap:var(--sp-2); margin-top:var(--sp-4); font-size:var(--fs-sm); flex-wrap:wrap; }
.detail .dt-actions{ display:flex; gap:var(--sp-2); margin-top:var(--sp-5); flex-wrap:wrap; }

/* ---------- D.6 文档列表 ---------- */
.toolrow{ display:flex; align-items:center; gap:var(--sp-3); margin-bottom:var(--sp-3); flex-wrap:wrap; }
.select{
  display:inline-flex; align-items:center; height:var(--h-control); padding:0 var(--sp-2);
  border:1px solid var(--c-line-strong); border-radius:var(--r-sm); background:var(--c-surface);
  font-size:var(--fs-sm); color:var(--c-text);
}
.toolrow .grow{ margin-left:auto; font-size:var(--fs-sm); color:var(--c-text-3); }
.qchip{
  display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px;
  background:var(--c-sunken); border:1px solid var(--c-line); border-radius:var(--r-pill);
  font-size:var(--fs-xs); color:var(--c-text-2);
}
.doctable{ border:1px solid var(--c-line); border-radius:var(--r-lg); background:var(--c-surface); box-shadow:var(--sh-1); overflow:hidden; }
.doctable .thead{
  display:grid; grid-template-columns:minmax(0,1fr) 96px 132px 116px; gap:var(--sp-4);
  padding:10px var(--sp-5); background:var(--c-surface-2); border-bottom:1px solid var(--c-line);
  font-size:var(--fs-xs); font-weight:var(--fw-medium); color:var(--c-text-3);
}
.doctable .thead span:last-child{ justify-self:end; }
.docrow{
  display:grid; grid-template-columns:minmax(0,1fr) 96px 132px 116px; gap:var(--sp-4); align-items:center;
  min-height:44px; padding:8px var(--sp-5); border-bottom:1px solid var(--c-line); width:100%;
  transition:background var(--dur-1) var(--ease-out);
}
.docrow:last-child{ border-bottom:0; }
.docrow:hover{ background:var(--c-surface-2); }
.docrow[aria-current="true"]{ box-shadow:inset 2px 0 0 var(--c-text); }
.docrow .p{ font:var(--fw-regular) var(--fs-mono)/var(--lh-mono) var(--mono); color:var(--c-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.docrow .t,.docrow .m{ font-size:var(--fs-sm); color:var(--c-text-3); }
.docrow .s{ justify-self:end; }

.doc-more{ display:flex; justify-content:center; padding:10px; font-size:var(--fs-xs); color:var(--c-text-3); }

/* ---------- 提示词（路线子页）与提示词库 ---------- */
.prompt-list{ display:flex; flex-direction:column; gap:2px; margin:0 0 var(--sp-4); }
.prompt-opt{
  display:flex; align-items:center; gap:var(--sp-3); width:100%; padding:8px 10px; border-radius:var(--r-sm);
  border:1px solid transparent; transition:background var(--dur-1) var(--ease-out);
}
.prompt-opt:hover{ background:var(--c-sunken); }
.prompt-opt[aria-pressed="true"]{ background:var(--c-surface); border-color:var(--c-line); box-shadow:var(--sh-1); }
.prompt-opt .po-title{ font-size:var(--fs-sm); font-weight:var(--fw-medium); }
.prompt-opt .po-sub{ font-size:var(--fs-xs); color:var(--c-text-3); }
.panel{ background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--r-lg); box-shadow:var(--sh-1); padding:var(--sp-5); }
.panel h2{ font-size:var(--fs-h2); line-height:var(--lh-h2); font-weight:var(--fw-semibold); margin-top:6px; }
.panel .panel-desc{ margin-top:4px; font-size:var(--fs-sm); color:var(--c-text-2); }
.panel .actions{ display:flex; gap:var(--sp-2); margin-top:var(--sp-4); flex-wrap:wrap; }
.source-list{ display:flex; flex-direction:column; gap:2px; margin-top:var(--sp-3); }
.source-chip{ display:flex; align-items:center; gap:var(--sp-2); padding:6px 0; border-bottom:1px solid var(--c-line); font-size:var(--fs-sm); }
.source-chip .hash{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--c-text-3); }
.preview{
  margin-top:var(--sp-3); max-height:260px; overflow:auto; background:var(--c-sunken); border-radius:var(--r-md);
  padding:14px; font:var(--fw-regular) var(--fs-mono)/var(--lh-mono) var(--mono); color:var(--c-text-2); white-space:pre-wrap;
}
.pgroup{ border:1px solid var(--c-line); border-radius:var(--r-lg); background:var(--c-surface); box-shadow:var(--sh-1); margin-bottom:var(--sp-3); overflow:hidden; }
.pgroup-toggle{ display:flex; align-items:center; gap:var(--sp-2); width:100%; padding:12px var(--sp-5); font-size:var(--fs-h3); font-weight:var(--fw-semibold); }
.pgroup-toggle .chev{ margin-left:auto; color:var(--c-text-3); }
.pgroup-body{ border-top:1px solid var(--c-line); }
.prow{ display:flex; align-items:center; gap:var(--sp-3); padding:10px var(--sp-5); border-bottom:1px solid var(--c-line); flex-wrap:wrap; }
.prow:last-child{ border-bottom:0; }
.prow .pr-main{ min-width:0; flex:1 1 320px; }
.prow .pr-title{ font-size:var(--fs-sm); font-weight:var(--fw-medium); }
.prow .pr-sub{ font-size:var(--fs-xs); color:var(--c-text-3); margin-top:2px; }
.prow .pr-actions{ display:flex; gap:var(--sp-2); }

/* ---------- 来源表 ---------- */
.srctable{ width:100%; border-collapse:collapse; background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--r-lg); overflow:hidden; font-size:var(--fs-sm); }
.srctable th{ background:var(--c-surface-2); text-align:left; font-weight:var(--fw-medium); color:var(--c-text-3); font-size:var(--fs-xs); padding:10px var(--sp-4); border-bottom:1px solid var(--c-line); }
.srctable td{ padding:11px var(--sp-4); border-bottom:1px solid var(--c-line); color:var(--c-text-2); vertical-align:top; }
.srctable tr:last-child td{ border-bottom:0; }
.srctable .mono{ font:var(--fw-regular) var(--fs-mono)/var(--lh-mono) var(--mono); }

/* ---------- D.10 空 / 加载 / 错误 ---------- */
.state{
  background:var(--c-surface); border:1px dashed var(--c-line); border-radius:var(--r-lg);
  padding:var(--sp-8) var(--sp-5); text-align:center;
}
.state .ic{ font-size:24px; color:var(--c-text-3); }
.state h3{ font-size:var(--fs-h3); font-weight:var(--fw-semibold); margin:10px 0 4px; }
.state p{ font-size:var(--fs-sm); color:var(--c-text-2); margin-bottom:var(--sp-4); }
.skel{ background:var(--c-sunken); border-radius:var(--r-xs); height:12px; margin:8px 0; }

/* ---------- D.12 toast ---------- */
.toast{
  position:fixed; right:var(--sp-6); bottom:var(--sp-6); z-index:var(--z-toast);
  display:inline-flex; align-items:center; gap:10px; max-width:min(420px,calc(100vw - 32px));
  background:var(--c-surface); border:1px solid var(--c-line); border-left:3px solid var(--route-green);
  border-radius:var(--r-md); box-shadow:var(--sh-3); padding:10px 14px; font-size:var(--fs-sm);
  transform:translateY(8px); opacity:0; transition:transform var(--dur-3) var(--ease-out),opacity var(--dur-3) var(--ease-out);
}
.toast[data-shown="true"]{ transform:none; opacity:1; }
.toast[data-tone="warn"]{ border-left-color:var(--c-warn-line); }
.toast[data-tone="error"]{ border-left-color:var(--c-danger); }

/* ---------- D.7 命令面板 ---------- */
.palette-wrap{
  position:fixed; inset:0; z-index:var(--z-palette); display:flex; justify-content:center; align-items:flex-start;
  padding:12vh var(--sp-6) var(--sp-6);
}
.palette-scrim{ position:absolute; inset:0; background:rgba(24,34,29,.28); opacity:0; transition:opacity var(--dur-2) var(--ease-out); }
.palette-wrap[data-shown="true"] .palette-scrim{ opacity:1; }
.palette{
  position:relative; width:var(--w-palette); max-width:100%; max-height:62vh; display:flex; flex-direction:column;
  background:var(--c-surface); border:1px solid var(--c-line); border-radius:var(--r-xl);
  box-shadow:var(--sh-5); overflow:hidden; transform:scale(.98); opacity:0;
  transition:transform var(--dur-2) var(--ease-out),opacity var(--dur-2) var(--ease-out);
}
.palette-wrap[data-shown="true"] .palette{ transform:none; opacity:1; }
.p-input{ display:flex; align-items:center; gap:var(--sp-3); height:52px; padding:0 var(--sp-4); border-bottom:1px solid var(--c-line); }
.p-input input{ flex:1; min-width:0; border:0; background:none; font-size:var(--fs-body); outline:0; }
.p-list{ overflow:auto; padding:var(--sp-2) 0; min-height:64px; }
.p-group{ font-size:11px; letter-spacing:.08em; color:var(--c-text-3); padding:8px var(--sp-4) 4px; font-weight:var(--fw-medium); }
.p-opt{ display:flex; align-items:center; gap:var(--sp-3); min-height:40px; padding:0 var(--sp-4); font-size:var(--fs-sm); width:100%; }
.p-opt:hover{ background:var(--c-sunken); }
.p-opt[aria-selected="true"]{ background:var(--c-sunken); box-shadow:inset 2px 0 0 var(--c-focus); }
.p-opt .ico{ width:16px; text-align:center; color:var(--c-text-3); flex:none; }
.p-opt .sub{ margin-left:auto; font-size:var(--fs-xs); color:var(--c-text-3); font-family:var(--mono); }
.p-opt mark{ background:var(--c-warn-bg); color:inherit; border-radius:2px; }
.p-foot{ display:flex; gap:var(--sp-4); padding:10px var(--sp-4); border-top:1px solid var(--c-line); background:var(--c-surface-2); font-size:var(--fs-xs); color:var(--c-text-3); }
.p-empty{ padding:var(--sp-6) var(--sp-4); text-align:center; font-size:var(--fs-sm); color:var(--c-text-2); }
.p-empty .btn{ margin-top:var(--sp-3); }

/* ---------- D.8 抽屉阅读器 ---------- */
.drawer-scrim{ position:fixed; inset:0; z-index:var(--z-scrim); background:rgba(24,34,29,.28); opacity:0; transition:opacity var(--dur-2) var(--ease-out); }
.drawer-scrim[data-shown="true"]{ opacity:1; }
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:var(--z-drawer);
  width:var(--drawer-w,640px); max-width:100vw; height:100dvh;
  display:flex; flex-direction:column; background:var(--c-surface); border-left:1px solid var(--c-line);
  border-radius:var(--r-xl) 0 0 var(--r-xl); box-shadow:var(--sh-4);
  transform:translateX(16px); opacity:0;
  transition:transform var(--dur-3) var(--ease-out),opacity var(--dur-3) var(--ease-out);
}
.drawer[data-shown="true"]{ transform:none; opacity:1; }
.d-head{ display:flex; align-items:flex-start; gap:var(--sp-3); padding:var(--sp-4) var(--sp-5); border-bottom:1px solid var(--c-line); }
.d-head .d-title-wrap{ min-width:0; flex:1; }
.d-head h2{ font-size:var(--fs-h3); line-height:var(--lh-h3); font-weight:var(--fw-semibold); }
.d-path{ margin-top:4px; font:var(--fw-regular) var(--fs-xs)/var(--lh-xs) var(--mono); color:var(--c-text-3); word-break:break-all; }
.d-toc-fold{ margin-top:6px; font-size:var(--fs-xs); color:var(--c-text-2); }
.d-toc-fold summary{ cursor:pointer; }
.d-tools{ display:flex; align-items:center; gap:var(--sp-2); padding:10px var(--sp-5); border-bottom:1px solid var(--c-line); flex-wrap:wrap; }
.d-tools .grow{ margin-left:auto; display:flex; gap:var(--sp-2); }
.seg{ display:flex; gap:2px; padding:2px; background:var(--c-sunken); border-radius:var(--r-sm); }
.seg button{ height:26px; padding:0 10px; border-radius:var(--r-xs); font-size:var(--fs-xs); color:var(--c-text-2); }
.seg button[aria-pressed="true"]{ background:var(--c-surface); color:var(--c-text); font-weight:var(--fw-medium); box-shadow:var(--sh-1); }
.d-meta{ display:flex; gap:var(--sp-3); flex-wrap:wrap; padding:8px var(--sp-5); font-size:var(--fs-xs); color:var(--c-text-3); border-bottom:1px solid var(--c-line); }
.d-body{ flex:1; min-height:0; display:grid; grid-template-columns:180px minmax(0,1fr); }
.d-toc{ grid-column:1; border-right:1px dashed var(--c-line); overflow:auto; padding:var(--sp-4) var(--sp-3); font-size:var(--fs-xs); }
.d-toc a{ display:block; padding:3px 0; color:var(--c-text-2); text-decoration:none; }
.d-toc a:hover{ color:var(--c-text); }
.d-scroll{ grid-column:2; overflow:auto; padding:var(--sp-5); }
.prose{ max-width:68ch; }
.prose h2{ font-size:var(--fs-h1); line-height:var(--lh-h1); font-weight:var(--fw-semibold); margin:var(--sp-5) 0 var(--sp-3); scroll-margin-top:120px; }
.prose h3{ font-size:var(--fs-h2); line-height:var(--lh-h2); font-weight:var(--fw-semibold); margin:var(--sp-5) 0 var(--sp-3); scroll-margin-top:120px; }
.prose h4,.prose h5,.prose h6{ font-size:var(--fs-h3); line-height:var(--lh-h3); font-weight:var(--fw-semibold); margin:var(--sp-4) 0 var(--sp-2); scroll-margin-top:120px; }
.prose h2:first-child{ margin-top:0; }
.prose p{ margin-bottom:var(--sp-4); }
.prose code{ background:var(--c-sunken); border-radius:var(--r-xs); padding:1px 5px; font-family:var(--mono); font-size:var(--fs-mono); }
.prose pre{ background:var(--c-sunken); border-radius:var(--r-md); padding:14px; overflow:auto; margin-bottom:var(--sp-4); }
.prose pre code{ background:none; padding:0; }
.prose table{ border-collapse:collapse; margin-bottom:var(--sp-4); display:block; overflow:auto; max-width:100%; }
.prose th,.prose td{ border:1px solid var(--c-line); padding:8px 10px; text-align:left; }
.prose th{ background:var(--c-surface-2); font-weight:var(--fw-medium); }
.prose blockquote{ border-left:3px solid var(--c-line-strong); color:var(--c-text-2); padding-left:var(--sp-3); margin-bottom:var(--sp-4); }
.prose hr{ border:0; border-top:1px solid var(--c-line); margin:var(--sp-5) 0; }
.prose ul,.prose ol{ margin:0 0 var(--sp-4) 20px; }
.prose ul{ list-style:disc; } .prose ol{ list-style:decimal; }
.prose li{ margin-bottom:4px; }
.prose a{ color:var(--route-green); text-decoration:underline; text-underline-offset:2px; }
.raw{
  margin:0; white-space:pre-wrap; word-break:break-word;
  font:var(--fw-regular) var(--fs-mono)/var(--lh-mono) var(--mono); color:var(--c-text);
}

/* ---------- 手工复制 dialog ---------- */
#copy-dialog{
  width:min(720px,calc(100vw - 32px)); border:1px solid var(--c-line-strong); border-radius:var(--r-lg);
  padding:var(--sp-5); background:var(--c-surface); color:var(--c-text); box-shadow:var(--sh-4);
}
#copy-dialog::backdrop{ background:rgba(24,34,29,.28); }
#copy-dialog h2{ font-size:var(--fs-h2); font-weight:var(--fw-semibold); margin-bottom:var(--sp-2); }
#copy-dialog p{ font-size:var(--fs-sm); color:var(--c-text-2); margin-bottom:var(--sp-3); }
#copy-text{ width:100%; height:240px; resize:vertical; border:1px solid var(--c-line-strong); border-radius:var(--r-sm); padding:10px; font:var(--fw-regular) var(--fs-mono)/var(--lh-mono) var(--mono); }
.dialog-actions{ display:flex; justify-content:flex-end; margin-top:var(--sp-4); }

/* ---------- 公共小件 ---------- */
.small{ font-size:var(--fs-xs); line-height:var(--lh-xs); }
.muted{ color:var(--c-text-3); }
.section-title{ display:flex; align-items:baseline; gap:var(--sp-3); margin-bottom:var(--sp-3); }
.section-title h2{ font-size:var(--fs-h1); line-height:var(--lh-h1); font-weight:var(--fw-semibold); }
.eyebrow{ font-size:var(--fs-xs); letter-spacing:.08em; color:var(--c-text-3); font-weight:var(--fw-medium); margin-bottom:var(--sp-2); }
.caption{ margin-top:var(--sp-3); }
.count{ font-size:var(--fs-xs); font-weight:var(--fw-regular); color:var(--c-text-3); }
.badge-group{ display:flex; gap:var(--sp-2); margin-top:var(--sp-3); flex-wrap:wrap; }
.rc-id{ font-size:var(--fs-xs); font-weight:var(--fw-semibold); letter-spacing:.06em; color:var(--route,var(--route-green)); }
.segment .route-name{ max-width:9em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qchip button{ color:var(--c-text-3); font-size:11px; }
.qchip button:hover{ color:var(--c-text); }
.doc-sentinel{ min-height:1px; padding:8px 0; text-align:center; font-size:var(--fs-xs); color:var(--c-text-3); }
.prompt-layout{ display:grid; grid-template-columns:240px minmax(0,1fr); gap:var(--sp-6); align-items:start; }
.prompt-layout .panel{ min-width:0; }

/* AC-47 200% 缩放（等效 320 CSS px 内容宽） */

  html{ scroll-behavior:auto; }

<script type="application/json" id="hub-data">__HUB_DATA__</script>
<script>
(() => {
'use strict';

/* ============================================================
   1. 数据与工具
   ============================================================ */
let DATA = JSON.parse(document.getElementById('hub-data').textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));
const ROUTES = () => DATA.routes || [];
const routeBy = (id) => ROUTES().find((r) => r.id === id) || null;
const allDocs = () => [...(DATA.shared_documents || []), ...ROUTES().flatMap((r) => r.documents || [])];
const docById = (id) => allDocs().find((d) => d.id === id) || null;
const stageOf = (r, id) => (r && r.stages ? r.stages.find((s) => s.id === id) || null : null);
const currentStage = (r) => (r && r.stages ? r.stages.find((s) => s.id === r.current_stage) || r.stages[0] : null);
const availableCount = (r) => (r.documents || []).filter((d) => d.available).length;
const isLive = () => DATA.live === true;
const prefersReduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const stateMeta = {
  recorded: { icon: '✓', text: '已记录' },
  current: { icon: '●', text: '当前' },
  planned: { icon: '○', text: '计划' },
  blocked: { icon: '⏸', text: '待前序' },
};
const promptKindLabel = (p) => ({ complete: '可直接复制的完整包', original: '原始阶段提示词', plan: '方案生成的交接包', resume: '继续研究启动语', none: '无独立提示词' }[p && p.kind] || '来源不可用');
const CAT_KEYS = { plan: '技术方案', prompts: '提示词', acceptance: '实验与验收', candidates: '候选说明', reviews: '研究与复查', project: '项目说明' };
const catKey = (v) => {
  if (!v || v === 'all') return 'all';
  if (CAT_KEYS[v]) return v;
  const hit = Object.keys(CAT_KEYS).find((k) => CAT_KEYS[k] === v);
  return hit || 'all';
};
const badgeClass = (color) => ({ green: 'badge-green', blue: 'badge-blue', orange: 'badge-orange' }[color] || 'badge-neutral');
const routeVars = (color) => {
  const c = ['green', 'blue', 'orange'].includes(color) ? color : 'green';
  return '--route:var(--route-' + c + ');--route-soft:var(--route-' + c + '-soft);--route-line:var(--route-' + c + '-line);--route-ink:var(--route-' + c + '-ink)';
};
const displayState = (s) => {
  if (!s) return 'planned';
  if (s.state === 'recorded' || s.state === 'current') return s.state;
  if (s.state === 'blocked' || /待前序|阻塞|暂缓/.test(String(s.label || ''))) return 'blocked';
  return 'planned';
};
const fmtDate = (iso, withYear) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  const parts = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(d);
  const get = (t) => (parts.find((p) => p.type === t) || {}).value || '';
  const ymd = get('year') + '-' + get('month') + '-' + get('day');
  const hm = get('hour') + ':' + get('minute');
  return withYear ? ymd + ' ' + hm : get('month') + '/' + get('day') + ' ' + hm;
};
const firstSentence = (text, max) => {
  const raw = String(text || '').trim();
  if (!raw) return '';
  const head = raw.split(/[。；;]/)[0] || raw;
  return head.length > max ? head.slice(0, max) + '…' : head;
};
const timeTag = (iso, label) => '<time datetime="' + esc(iso || '') + '">' + esc(label) + '</time>';

/* ============================================================
   2. 状态 / hash 解析（新路径式 + 旧深链翻译）
   ============================================================ */
let state = blankState();
const ui = {
  closedNotices: new Set(), openCards: new Set(), openDescs: new Set(), openGroups: new Set(),
  docShown: 40, docObserver: null, drawerReturn: null, paletteItems: [], paletteIndex: 0, paletteQuery: '',
  lineageNode: '', lineageMode: 'all',
};
function blankState() {
  return { ws: 'overview', routeId: '', sub: '', stageId: '', docId: '', mode: 'render', anchor: '', cat: 'all', q: '', group: '' };
}
function normalize(s) {
  const out = { ...blankState(), ...s };
  if (out.ws === 'route') {
    if (!routeBy(out.routeId)) out.routeId = ROUTES()[0] ? ROUTES()[0].id : '';
    if (!['stage', 'evidence', 'prompts'].includes(out.sub)) out.sub = 'stage';
    if (out.sub !== 'stage') out.stageId = stageOf(routeBy(out.routeId), out.stageId) ? out.stageId : '';
    else if (out.stageId && !stageOf(routeBy(out.routeId), out.stageId)) out.stageId = '';
  } else if (out.ws === 'library') {
    if (!['docs', 'prompts', 'sources'].includes(out.sub)) out.sub = 'docs';
  } else {
    out.ws = 'overview'; out.sub = ''; out.stageId = '';
  }
  if (out.ws !== 'library') { out.cat = 'all'; out.q = ''; }
  out.cat = catKey(out.cat);
  if (!['render', 'raw'].includes(out.mode)) out.mode = 'render';
  return out;
}
function hashParts() {
  const raw = location.hash.replace(/^#\/?/, '');
  const qi = raw.indexOf('?');
  const path = qi >= 0 ? raw.slice(0, qi) : raw;
  const query = qi >= 0 ? raw.slice(qi + 1) : '';
  return { raw, path, query, seg: path.split('/').filter(Boolean) };
}
function resolveDocParam(value, scope) {
  if (!value) return '';
  let p = value;
  try { p = decodeURIComponent(value); } catch (e) { /* keep raw */ }
  const pools = [];
  if (scope.ws === 'route') {
    const r = routeBy(scope.routeId);
    if (r) pools.push(r.documents || []);
  }
  pools.push(DATA.shared_documents || []);
  pools.push(...ROUTES().map((r) => r.documents || []));
  for (const pool of pools) {
    const hit = pool.find((d) => d.relative === p);
    if (hit) return hit.id;
  }
  return '';
}
function translateLegacy(raw) {
  const p = new URLSearchParams(raw);
  const view = p.get('view') || '';
  const tab = p.get('tab') || '';
  const stage = p.get('stage') || '';
  const r = routeBy(view);
  if (r) {
    const st = stageOf(r, stage);
    if (tab === 'documents') return { ws: 'route', routeId: r.id, sub: 'evidence' };
    if (tab === 'prompts') return { ws: 'route', routeId: r.id, sub: 'prompts', stageId: st ? st.id : '' };
    if (stage) return { ws: 'route', routeId: r.id, sub: 'stage', stageId: st ? st.id : '' };
    return { ws: 'route', routeId: r.id, sub: 'stage' };
  }
  if (view === 'documents') return { ws: 'library', sub: 'docs' };
  if (view === 'prompts') return { ws: 'library', sub: 'prompts' };
  if (view === 'sources') return { ws: 'library', sub: 'sources' };
  return { ws: 'overview' };
}
function parseHash() {
  const { raw, query, seg } = hashParts();
  const out = blankState();
  if (raw && /^view=/.test(raw)) return normalize(translateLegacy(raw));
  if (raw) {
    if (seg[0] === 'route') {
      out.ws = 'route';
      out.routeId = routeBy(seg[1]) ? seg[1] : (ROUTES()[0] ? ROUTES()[0].id : '');
      const sub = seg[2] || 'stage';
      out.sub = ['stage', 'evidence', 'prompts'].includes(sub) ? sub : 'stage';
      if (out.sub === 'stage' && seg[3]) {
        const st = stageOf(routeBy(out.routeId), seg[3]);
        if (st) out.stageId = st.id;
      }
    } else if (seg[0] === 'library') {
      out.ws = 'library';
      out.sub = ['docs', 'prompts', 'sources'].includes(seg[1]) ? seg[1] : 'docs';
    }
  }
  const q = new URLSearchParams(query);
  out.cat = catKey(q.get('cat'));
  out.q = q.get('q') || '';
  out.group = q.get('route') || '';
  out.mode = q.get('mode') === 'raw' ? 'raw' : 'render';
  out.docId = resolveDocParam(q.get('doc'), out);
  return normalize(out);
}
function hashFor(s) {
  let base = '#/overview';
  if (s.ws === 'route') {
    const r = routeBy(s.routeId) || ROUTES()[0];
    if (r) {
      base = '#/route/' + r.id;
      if (s.sub === 'evidence') base += '/evidence';
      else if (s.sub === 'prompts') base += '/prompts';
      else if (s.sub === 'stage' && s.stageId) base += '/stage/' + s.stageId;
    }
  } else if (s.ws === 'library') {
    base = '#/library/' + (['docs', 'prompts', 'sources'].includes(s.sub) ? s.sub : 'docs');
  }
  const q = new URLSearchParams();
  if (s.docId) {
    const d = docById(s.docId);
    q.set('doc', d ? d.relative : s.docId);
    if (s.mode === 'raw') q.set('mode', 'raw');
  }
  if (s.ws === 'library') {
    if (s.cat && s.cat !== 'all') q.set('cat', s.cat);
    if (s.q) q.set('q', s.q);
    if (s.sub === 'prompts' && s.group) q.set('route', s.group);
  }
  const qs = q.toString();
  return qs ? base + '?' + qs : base;
}
let lastHash = '';
function commit(next, opts) {
  const o = opts || {};
  state = normalize({ ...state, ...next });
  const h = hashFor(state);
  if (location.hash !== h) {
    if (o.push === false) history.replaceState(null, '', h);
    else history.pushState(null, '', h);
  }
  lastHash = h;
  render();
  if (o.scroll !== false) window.scrollTo({ top: 0, behavior: 'instant' });
}
function syncFromLocation() {
  state = parseHash();
  const h = hashFor(state);
  if (location.hash !== h) history.replaceState(null, '', h);
  lastHash = h;
  render();
}
window.addEventListener('popstate', () => { if (location.hash !== lastHash) syncFromLocation(); });
window.addEventListener('hashchange', () => { if (location.hash !== lastHash) syncFromLocation(); });

/* ============================================================
   3. toast / 复制 / 下载 / 刷新
   ============================================================ */
let toastTimer = null, toastHideTimer = null;
function toast(message, tone) {
  const el = $('toast');
  el.textContent = message;
  el.dataset.tone = tone || 'success';
  el.dataset.shown = 'false';
  el.hidden = false;
  clearTimeout(toastTimer); clearTimeout(toastHideTimer);
  requestAnimationFrame(() => { el.dataset.shown = 'true'; });
  toastTimer = setTimeout(() => {
    el.dataset.shown = 'false';
    toastHideTimer = setTimeout(() => { el.hidden = true; }, 200);
  }, 3000);
}
async function copyText(text, label) {
  try {
    if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('clipboard unavailable');
    await navigator.clipboard.writeText(text);
    toast(label);
    return true;
  } catch (err) {
    const field = $('copy-text');
    field.value = text;
    const dlg = $('copy-dialog');
    if (!dlg.open) dlg.showModal();
    field.focus();
    field.select();
    return false;
  }
}
function saveFile(text, name) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();

let refreshing = false;
async function refresh() {
  if (!isLive()) {
    location.href = 'http://127.0.0.1:8876/' + hashFor(state);
    return;
  }
  if (refreshing) return;
  refreshing = true;
  const btn = $('refresh');
  btn.dataset.state = 'loading';
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  setSync('loading', '正在生成…');
  try {
    const response = await fetch('/api/rebuild', { method: 'POST', headers: { 'X-OWAC-Hub': '1' }, cache: 'no-store' });
    const next = await response.json();
    if (!response.ok) throw new Error(next.error || ('HTTP ' + response.status));
    if (next.schema_version !== 1 || !Array.isArray(next.routes)) throw new Error('invalid snapshot');
    DATA = next;
    state = parseHash();
    btn.dataset.state = 'idle';
    btn.disabled = false;
    btn.setAttribute('aria-busy', 'false');
    render();
    const d = new Date();
    setSync('ok', '已更新 · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
  } catch (err) {
    btn.dataset.state = 'error';
    btn.disabled = false;
    btn.setAttribute('aria-busy', 'false');
    render();
    setSync('error', '生成失败，已保留当前内容');
  } finally {

}

  if (act === 'toggle-group') { toggleGroup(el.dataset.group); return; }
  if (act === 'toggle-pgroup') { togglePgroup(el.dataset.route); return; }
  if (act === 'dismiss-notice') { ui.closedNotices.add(el.dataset.notice); render(); return; }
  if (act === 'go-stage-prompts') { commit({ sub: 'prompts', stageId: state.stageId }, { push: false }); return; }
  if (act === 'pick-stage') { commit({ sub: 'prompts', stageId: el.dataset.stage }, { push: false }); return; }
  if (act === 'open-prompt') { commit({ ws: 'route', routeId: el.dataset.route, sub: 'prompts', stageId: el.dataset.stage }); return; }
  if (act === 'copy-command') {
    copyText('cd ' + DATA.repo + '\n' + (el.dataset.cmd === 'serve' ? 'make research-hub-serve' : 'make research-hub') + '\n', '已复制命令');
    return;
  }
  if (act === 'clear-q') { commit({ q: '' }, { push: false }); return; }
  if (act === 'clear-filters') { commit({ cat: 'all', q: '' }, { push: false }); return; }
  if (act === 'source-link') { e.preventDefault(); resolveLink(el.dataset.link); return; }
  if (act === 'toc') { e.preventDefault(); scrollToAnchor(el.dataset.anchor); return; }
  if (act === 'palette-run') { runPaletteItem(Number(el.dataset.idx)); return; }
  if (act === 'palette-filter-docs') {
    const q = ui.paletteQuery;
    closePalette();
    commit({ ws: 'library', sub: 'docs', q: q.trim() });
    return;
  }
});
document.addEventListener('change', (e) => {
  const sel = e.target.closest ? e.target.closest('[data-qa="doc-filter"]') : null;
  if (sel) commit({ cat: catKey(sel.value) }, { push: false });
});
$('search-open').addEventListener('click', () => openPalette());
$('refresh').addEventListener('click', () => refresh());
$('drawer-close').addEventListener('click', () => closeDrawer());
$('drawer-scrim').addEventListener('click', () => closeDrawer());
$('palette-scrim').addEventListener('click', () => closePalette());
$('copy-close').addEventListener('click', () => { const dlg = $('copy-dialog'); if (dlg.open) dlg.close(); });
document.querySelectorAll('[data-qa="drawer-mode"]').forEach((b) => b.addEventListener('click', () => {
  commit({ mode: b.dataset.mode }, { push: false, scroll: false });
}));
$('reader-copy').addEventListener('click', () => {
  const d = docById(state.docId);
  if (d) copyText(d.content || '', '已复制 Markdown 原文');
});
$('reader-download').addEventListener('click', () => {
  const d = docById(state.docId);
  if (d) saveFile(d.content || '', (d.relative || 'document.md').split('/').pop());
});
$('palette-input').addEventListener('input', (e) => { ui.paletteIndex = 0; ui.paletteQuery = e.target.value; paletteRender(e.target.value); });
$('palette-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(ui.paletteIndex); }
  else if (e.key === 'Tab') { e.preventDefault(); }
});
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    if (paletteOpen()) closePalette(); else openPalette();
    return;
  }
  if (e.key === '/' && !inField && !paletteOpen() && !drawerOpen()) { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') {
    if (paletteOpen()) { e.preventDefault(); closePalette(); return; }
    if (drawerOpen()) { e.preventDefault(); closeDrawer(); return; }
    return;
  }
  if (e.key === 'Tab') {
    if (paletteOpen()) { e.preventDefault(); return; }
    if (drawerOpen()) { trapFocus(e, $('reader')); return; }
  }
  if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key) && e.target.closest) {
    const strip = e.target.closest('[data-qa="stage-strip"]');
    if (strip) { e.preventDefault(); moveStageStrip(strip, e.key); return; }
    const switcher = e.target.closest('[data-qa="route-switcher"]');
    if (switcher) {
      e.preventDefault();
      moveRoving(switcher, e.key, 'route-tab', (id) => commit({ ws: 'route', routeId: id, sub: 'stage' }));
      const el = document.querySelector('[data-qa="route-tab"][data-route="' + (routeBy(state.routeId) || {}).id + '"]');
      if (el) el.focus();
      return;
    }
    const subs = e.target.closest('.subtabs');
    if (subs) {
      e.preventDefault();
      moveRoving(subs, e.key, 'subtab', (sub) => commit({ sub }));
      const el = document.querySelector('[data-qa="subtab"][data-sub="' + state.sub + '"]');
      if (el) el.focus();
      return;
    }
  }
});
window.addEventListener('resize', () => { if (drawerOpen()) paintDrawer(); });
syncTopbar();
syncFromLocation();
if (isLive()) refresh();
})();
</script>
</body>
</html>
