<dialog id="reader" aria-labelledby="reader-title"><div class="reader-header"><div><h2 id="reader-title"></h2><div class="doc-path" id="reader-path"></div></div><div class="reader-tools"><button class="btn" id="reader-toggle">查看原文</button><button class="btn" id="reader-copy">复制原文</button><button class="btn" id="reader-download">下载 .md</button><button class="btn" id="reader-close" aria-label="关闭文档">关闭 ×</button></div></div><div class="reader-meta" id="reader-meta"></div><div class="reader-body"><nav class="reader-toc" id="reader-toc" aria-label="文档目录"></nav><div class="reader-scroll" id="reader-scroll"><article class="prose" id="reader-content"></article></div></div></dialog>
<dialog id="copy-dialog" class="copy-fallback" aria-labelledby="copy-title"><h2 id="copy-title">手动复制</h2><p>浏览器没有授予剪贴板权限，全文已选中。按 Ctrl/Cmd+C 复制。</p><textarea id="copy-text" readonly aria-label="待复制全文"></textarea><button class="btn" id="copy-close">完成</button></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="hub-data">__HUB_DATA__</script>
<script>
(() => {
'use strict';
let data=JSON.parse(document.getElementById('hub-data').textContent);
let state={view:'overview',tab:'roadmap',stage:'',query:'',filter:'全部'};
let readerDoc=null,rawMode=false,toastTimer;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const routes=()=>data.routes;
const routeBy=id=>routes().find(r=>r.id===id);
const allDocs=()=>[...data.shared_documents,...routes().flatMap(r=>r.documents)];
const docBy=(route,path)=>allDocs().find(d=>d.id===`${route}:${path}`);
const date=s=>s?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(s)):'—';
const notice=s=>`<div class="notice">${esc(s)}</div>`;
const docButton=(route,path,label,cls='btn')=>`<button class="${cls}" data-doc="${esc(route+':'+path)}">${esc(label)}</button>`;
const current=r=>r.stages.find(s=>s.id===r.current_stage)||r.stages[0];
const availableCount=r=>r.documents.filter(d=>d.available).length;
const promptLabel=p=>({original:'原始阶段提示词',plan:'方案生成的交接包',resume:'继续研究启动语',none:'无独立提示词'}[p.kind]||'来源不可用');
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
async function copy(text,label='已复制'){try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(text);toast(label)}catch{const el=$('copy-text');el.value=text;$('copy-dialog').showModal();el.focus();el.select()}}
function saveFile(text,name){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function footer(){return `<div class="footer-note"><span>原文来自各自工作树 · 摘要复核日期 ${esc(data.reviewed_at)} · 计划与实测分别标注</span><span class="mono">OWAC / LOCAL RESEARCH HUB</span></div>`}
function syncLine(){return `<div class="sync-line"><span class="dot"></span><span>${data.live?'实时读取模式':'离线快照'} · 最近读取 ${date(data.generated_at)}（北京时间）</span><span>·</span><span>${allDocs().filter(d=>d.available).length} 份文档</span></div>`}
function heading(title,description,eyebrow='RESEARCH OVERVIEW'){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p>${syncLine()}</div><div class="heading-actions"><button class="btn" data-action="refresh">↻ 重新读取</button><button class="btn primary" data-nav="prompts">打开提示词库 <span class="arrow">↗</span></button></div></div>`}
function renderOverview(){
 const stale=routes().filter(r=>r.summary_stale);
 return heading('让每条研究路线，都有清晰的入口。','在这里确认开发树、查看当前方案，再复制属于正确路线和阶段的提示词。')+
 (stale.length?notice(`${stale.map(r=>r.id).join('、')} 的来源已更新，首页摘要需要复核。原文已同步到当前版本。`):'')+
 `<section class="overview-map" aria-label="研究路线关系"><div class="section-title"><h2>同一个研究问题，三条独立技术路线</h2><span class="small muted">平行候选 · 不串成一个流水线</span></div><div class="flow"><div class="flow-end"><strong>弱证据下的可靠表征</strong><small>RAW 测量 · 因果历史 · 有限预算</small></div><div class="connector"></div><div class="flow-routes">${routes().map(r=>`<button class="flow-route" data-nav="${r.id}"><strong>${r.id} ↗</strong><span>${esc(r.name.split('的').pop().replace('自适应',''))}</span></button>`).join('')}</div><div class="connector"></div><div class="flow-end"><strong>π0.5 / RawVLA-Bench</strong><small>共同的接入与评价边界</small></div></div></section>`+
 `<section class="route-grid" aria-label="三条研究路线">${routes().map(r=>`<article class="route-card ${r.color}"><div class="route-card-top"><div class="number-row"><span class="route-number">${r.id}</span><span class="badge ${r.summary_stale?'warn':r.color}">${r.summary_stale?'摘要待复核':esc(r.status)}</span></div><h3>${esc(r.name)}</h3><div class="version">${esc(r.version)}</div></div><div class="route-card-body"><p>${esc(r.summary)}</p><div class="card-phase"><span class="phase-marker">${esc(r.current_stage)}</span><span>${esc(current(r).title)}</span></div><div class="mini-stages" aria-hidden="true">${r.stages.map(s=>`<i class="${s.state}"></i>`).join('')}</div><span class="small muted" style="font-size:10px">路线节点示意 · 不表示完成百分比</span><div class="card-footer"><button class="btn primary" data-nav="${r.id}">查看路线 <span class="arrow">↗</span></button><button class="btn" data-route-prompt="${r.id}">提示词</button></div></div></article>`).join('')}</section>`+
 `<div class="bottom-grid"><section><div class="section-title"><h2>先确认下一步</h2><span class="small muted">依据当前记录</span></div>${routes().map(r=>`<div class="next-note"><span class="mono">${r.id}</span><p>${esc(r.next)} ${docButton(r.id,r.evidence_document,'查看依据 ↗','text-button')}</p></div>`).join('')}</section><section><div class="section-title"><h2>共同参考</h2><button class="text-button small muted" data-nav="documents">全部文档 ↗</button></div><div class="info-list">${[['docs/OWAC_research_roadmap_2026-10-08.md','研究路线图 v6','三条候选的共同研究边界'],['docs/decisions/0012-rawvla-pi05-protocol-freeze.md','RawVLA / π0.5 固定协议','部署标签、比较规则与证据边界'],['docs/status.md','主仓库状态记录','基准进度以最新记录为准']].map(([path,title,desc])=>`<div class="info-row"><span class="file-mark">MD</span><div class="info-text">${docButton('shared',path,title,'text-button')}<small>${desc}</small></div>${docButton('shared',path,'↗','btn quiet')}</div>`).join('')}</div></section></div>`+footer();
}
function routeHeader(r){return `<div class="page-heading"><div><div class="eyebrow">RESEARCH DIRECTION / ${r.id}</div><div class="route-title"><span class="route-number">${r.id}</span><h1>${esc(r.name)}</h1></div><p>${esc(r.short)}</p></div><div class="heading-actions">${docButton(r.id,r.primary_document,'阅读当前说明','btn primary')}<button class="btn" data-action="refresh">↻ 重新读取</button></div></div><div class="route-intro"><div class="context-box"><div class="eyebrow">要回答的问题</div><p>${esc(r.question)}</p><div class="sync-line"><span class="badge ${r.color}">${esc(r.version)}</span><span class="badge ${r.summary_stale?'warn':'gray'}">${r.summary_stale?'摘要待复核':esc(r.status)}</span></div></div><div class="checkout-panel">目标开发树<code>${esc(r.checkout)}</code><div class="checkout-row"><span class="mono">${esc(r.git.branch||'分支不可读')}</span><button class="btn quiet small-btn" data-copy-path="${r.id}">复制路径</button></div><div class="small">HEAD <span class="mono">${esc((r.git.head||'').slice(0,8))}</span> · 已跟踪修改 ${r.git.tracked_changes??'—'} 处 · 文档 ${availableCount(r)} 份</div></div></div>${r.warnings.map(notice).join('')}<div class="tabs" role="tablist" aria-label="路线内容">${[['roadmap','路线与阶段'],['documents','说明与证据'],['prompts','提示词与交接']].map(([id,label])=>`<button role="tab" aria-selected="${state.tab===id}" class="tab" data-tab="${id}">${label}</button>`).join('')}</div>`}
function renderRoadmap(r){return `<div class="section-title"><h2>开发顺序</h2><span class="small muted">点选节点，查看对应说明和交接入口</span></div><p class="source-summary">${esc(r.summary)}</p><div class="stage-grid">${r.stages.map(s=>`<button class="stage-card ${s.state}" data-stage="${s.id}"><div class="stage-id"><span>${s.id}</span><span class="badge ${s.state==='current'?r.color:'gray'}">${esc(s.label)}</span></div><strong>${esc(s.title)}</strong><p>${esc(s.description)}</p></button>`).join('')}</div><div class="route-note"><b>证据边界</b>　${esc(r.boundary)}<div class="prompt-actions">${docButton(r.id,r.evidence_document,'查看当前证据')}${docButton(r.id,'research/candidates/'+r.id+'.md','候选卡')}${docButton(r.id,'docs/status.md','工作树状态原文')}</div></div>`}
function legacy(r){return `<details class="legacy-toggle"><summary>历史原型提示词 · ${r.id} 初版</summary><div class="legacy-content">这是 2026-10-12 的原型开发入口，保留作历史参考。当前方案、修补和独立验收可能已改变下一步安排。${docButton(r.id,r.legacy_prompt,'查看历史全文')}</div></details>`}
function renderPrompt(r){const s=r.stages.find(x=>x.id===state.stage)||current(r),p=s.prompt;return `<div class="prompt-layout"><div><div class="eyebrow" style="margin-bottom:12px">选择一个阶段</div><div class="prompt-list">${r.stages.map(item=>`<button class="prompt-option ${item.id===s.id?'active':''}" data-stage="${item.id}" aria-pressed="${item.id===s.id}"><span class="mono">${item.id}</span><span><strong>${esc(item.title)}</strong><small>${esc(item.label)}</small></span></button>`).join('')}</div>${legacy(r)}</div><section class="prompt-panel"><div class="prompt-panel-head"><span class="badge ${r.color}">${r.id} / ${s.id}</span> <span class="badge gray">${promptLabel(p)}</span><h2>${esc(s.title)}</h2><p>${esc(s.description)}</p><div class="prompt-actions"><button class="btn primary" data-copy-prompt="${r.id}:${s.id}" ${p.available?'':'disabled'}>复制完整交接包</button><button class="btn" data-download-prompt="${r.id}:${s.id}" ${p.available?'':'disabled'}>下载 .txt</button>${docButton(r.id,s.document,'阅读对应原文')}</div></div><div class="prompt-panel-body">${r.summary_stale?notice('来源已更新，当前节点与状态摘要尚待复核。交接包使用最新原文，请先阅读前序验收。'):''}${p.kind==='plan'?notice('该路线尚无独立分阶段 prompt。此交接包由完整方案与所选阶段启动语组成，明确限制本次范围。'):''}${p.kind==='original'?`<p class="source-summary">完整复制包括：目标工作树、所选阶段、共同契约与该阶段的原始全文。每份来源附路径及 SHA256。</p>`:''}${!p.available?notice(p.reason||'没有可复制的提示词'):''}${(p.sources||[]).map(path=>`<div class="source-chip">${docButton(r.id,path,path,'text-button')}<div class="hash">${esc(docBy(r.id,path)?.sha256||'')}</div></div>`).join('')}${p.available?`<div class="prompt-caption">${s.excerpt?'所选阶段原文预览':'交接包开头预览'} · 复制时包含全部 ${p.text.length.toLocaleString()} 个字符</div><pre class="prompt-preview">${esc(s.excerpt||p.text.slice(0,1800))}${!s.excerpt&&p.text.length>1800?'\n\n… 预览省略；复制和下载均为完整内容。':''}</pre>`:''}</div></section></div>`}
function filteredDocs(route){let docs=route?route.documents:allDocs();const q=state.query.trim().toLowerCase();return docs.filter(d=>(state.filter==='全部'||d.category===state.filter)&&(!q||[d.route_id,d.title,d.relative,d.content].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.modified_at||'').localeCompare(a.modified_at||''))}
function renderDocuments(route=null){const docs=filteredDocs(route),filters=['全部','技术方案','提示词','实验与验收','候选说明','研究与复查','项目说明'];return `${route?'':heading('说明与证据，一处查阅。','查看各工作树的原始说明、方案和验收记录。页面原样保留历史结果与后续修正。','DOCUMENT LIBRARY')}<div class="toolbar"><div class="filters">${filters.map(f=>`<button class="filter ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><span class="small muted">${docs.length} 份${state.query?' · 搜索：'+esc(state.query):''}</span></div><div class="table-wrap"><table class="doc-table"><thead><tr><th>文档 / 来源</th><th>类别</th><th class="date-column">最近修改（北京时间）</th><th></th></tr></thead><tbody>${docs.map(d=>`<tr><td><button class="text-button doc-title" data-doc="${esc(d.id)}">${esc(d.title)}</button><div class="doc-path">${esc(d.route_id)} / ${esc(d.relative)}</div>${/DeepSeek_N\d+_implementation/.test(d.relative)?'<span class="history-label">历史原型入口</span>':''}${!d.available?'<span class="history-label">来源缺失</span>':''}${d.tracked===false?'<span class="history-label"> · 尚未跟踪</span>':''}</td><td><span class="badge gray">${esc(d.category||'不可读')}</span></td><td class="date-column small muted">${date(d.modified_at)}</td><td><button class="btn quiet" data-doc="${esc(d.id)}" aria-label="阅读 ${esc(d.title)}">↗</button></td></tr>`).join('')}</tbody></table>${!docs.length?'<div class="empty">没有匹配的文档。试试其他关键词或类别。</div>':''}</div>${route?'':footer()}`}
function renderPromptLibrary(){return heading('复制之前，先选对路线与阶段。','原始提示词、方案生成的交接包与历史入口分别标注。复制内容绑定目标工作树。','PROMPT LIBRARY')+routes().map(r=>`<section style="margin-bottom:26px"><div class="section-title"><h2><span class="mono">${r.id}</span>　${esc(r.name)}</h2><span class="badge ${r.color}">${esc(r.version)}</span></div>${r.stages.filter(s=>s.prompt.kind!=='none').map(s=>`<div class="library-prompt-row"><div><strong><span class="mono">${s.id}</span>　${esc(s.title)}</strong><p>${promptLabel(s.prompt)} · ${esc(s.label)}${s.id===r.current_stage?' · 当前节点':''}</p></div><div class="row-actions"><button class="btn" data-open-prompt="${r.id}:${s.id}">查看内容</button><button class="btn primary" data-copy-prompt="${r.id}:${s.id}" ${s.prompt.available?'':'disabled'}>复制交接包</button></div></div>`).join('')}${legacy(r)}</section>`).join('')+footer()}
function renderSources(){return heading('让入口与工作树保持一致。','原文和 Git 状态在读取时更新；路线选择、阶段标签和摘要由登记表管理。','SOURCE REGISTRY')+`<div class="route-note"><p class="source-summary">${data.live?'当前为自动更新模式。点击“重新读取”或刷新浏览器，会先在 repo 执行 make research-hub，生成完成后显示最新内容。':'当前为离线快照。点击“重新读取”将进入本地服务，自动执行 make research-hub 并更新页面。'}</p><div class="prompt-actions"><button class="btn" data-copy-command="build">复制更新命令</button><button class="btn" data-copy-command="serve">复制服务启动命令</button></div></div><div class="section-title" style="margin-top:25px"><h2>工作树登记</h2><span class="small muted">摘要不是实时实验判定</span></div><div class="table-wrap"><table class="doc-table"><thead><tr><th>路线 / 工作树</th><th>实际分支 / HEAD</th><th>文档</th><th>摘要来源</th></tr></thead><tbody>${routes().map(r=>`<tr><td><b>${r.id}</b><div class="doc-path">${esc(r.checkout)}</div></td><td><div class="mono small">${esc(r.git.branch||'不可读取')}</div><div class="hash">${esc((r.git.head||'').slice(0,12))}</div><div class="small muted">${r.git.tracked_changes??'—'} 个已跟踪修改</div></td><td>${availableCount(r)}<div class="small muted">未跟踪 ${r.documents.filter(d=>d.available&&!d.tracked).length}</div></td><td><span class="badge ${r.summary_stale?'warn':'gray'}">${r.summary_stale?'已变化 · 待复核':'与复核版本一致'}</span></td></tr>`).join('')}</tbody></table></div><div style="margin-top:28px"><h2>怎样维护这张统筹台</h2><div class="info-list" style="margin-top:15px"><div class="info-row"><span class="mono">01</span><div class="info-text"><strong>继续在对应工作树写方案、实验与提示词</strong><small>自动收录含本方向编号的 Markdown 文件；其他方向的拷贝不作为本方向入口。</small></div></div><div class="info-row"><span class="mono">02</span><div class="info-text"><strong>路线、阶段或摘要改变时，更新主仓库登记表</strong><small class="registry-path">${esc(data.registry)}</small></div></div><div class="info-row"><span class="mono">03</span><div class="info-text"><strong>重新生成页面，核对来源与当前节点</strong><small>摘要来源 hash 发生变化会提示复核；文档不存在时明确显示缺失，不自动切回旧 prompt。</small></div></div></div></div>`+footer()}
function render(){const r=routeBy(state.view);$('main').innerHTML=r?routeHeader(r)+(state.tab==='prompts'?renderPrompt(r):state.tab==='documents'?renderDocuments(r):renderRoadmap(r))+footer():state.view==='documents'?renderDocuments():state.view==='prompts'?renderPromptLibrary():state.view==='sources'?renderSources():renderOverview();$('breadcrumb').textContent=r?r.id+' · '+r.name:({overview:'总览',documents:'说明文档',prompts:'提示词库',sources:'来源与同步'}[state.view]||'总览');document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===state.view);if(b.closest('nav')){if(b.dataset.nav===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});$('mode-label').textContent=data.live?'本地服务 · 刷新自动生成':'离线快照 · 可直接打开'}
function navigate(view,tab='roadmap',stage=''){state.view=view;state.tab=tab;state.stage=stage;state.filter='全部';state.query='';$('global-search').value='';const params=new URLSearchParams({view,tab});if(stage)params.set('stage',stage);history.replaceState(null,'','#'+params);render();window.scrollTo({top:0,behavior:'instant'})}
function fromHash(){const p=new URLSearchParams(location.hash.slice(1)),view=p.get('view');if(view&&['overview','documents','prompts','sources',...routes().map(r=>r.id)].includes(view))state.view=view;state.tab=['roadmap','documents','prompts'].includes(p.get('tab'))?p.get('tab'):'roadmap';state.stage=p.get('stage')||'';render()}
function inline(s){const tokens=[];const token=v=>{tokens.push(v);return `\u0000${tokens.length-1}\u0000`};s=s.replace(/`([^`]+)`/g,(_,v)=>token('<code>'+esc(v)+'</code>'));s=s.replace(/!?\[([^\]]+)\]\(([^\s)]+)(?:\s+"[^"]*")?\)/g,(_,label,url)=>{if(/^https?:\/\//i.test(url))return token(`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`);if(/^(?:[a-z][a-z\d+.-]*:|\/\/)/i.test(url))return esc(label);return token(`<a href="#" data-source-link="${esc(url)}">${esc(label)}</a>`)});s=esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>');return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>tokens[Number(i)])}
const slug=s=>s.toLowerCase().replace(/<[^>]*>/g,'').replace(/[^\p{L}\p{N}\s_-]/gu,'').trim().replace(/\s+/g,'-');
function markdown(text){const lines=text.split('\n'),out=[],toc=[],ids={};let i=0;while(i<lines.length){let line=lines[i];if(!line.trim()){i++;continue}if(/^\s*```/.test(line)){const block=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))block.push(lines[i++]);i++;out.push('<pre><code>'+esc(block.join('\n'))+'</code></pre>');continue}const h=line.match(/^(#{1,6})\s+(.+)$/);if(h){let id=slug(h[2]);const n=ids[id]||0;ids[id]=n+1;if(n)id+='-'+n;out.push(`<h${h[1].length} id="${esc(id)}">${inline(h[2])}</h${h[1].length}>`);if(h[1].length<=3)toc.push({id,title:h[2],level:h[1].length});i++;continue}if(/^\s*([-*_])\1\1+\s*$/.test(line)){out.push('<hr>');i++;continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+:?\s*\|/.test(lines[i+1])){const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|');const header=cells(line);i+=2;let rows='';while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows+='<tr>'+cells(lines[i++]).map(v=>'<td>'+inline(v.trim())+'</td>').join('')+'</tr>'}out.push('<table><thead><tr>'+header.map(v=>'<th>'+inline(v.trim())+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>');continue}if(/^\s*([-*+]\s|\d+[.)]\s)/.test(line)){const ordered=/^\s*\d/.test(line),items=[];while(i<lines.length&&/^\s*([-*+]\s|\d+[.)]\s)/.test(lines[i]))items.push('<li>'+inline(lines[i++].replace(/^\s*([-*+]\s|\d+[.)]\s)/,'').replace(/^\[x\]\s/i,'✓ ').replace(/^\[ \]\s/,'□ '))+'</li>');out.push(`<${ordered?'ol':'ul'}>`+items.join('')+`</${ordered?'ol':'ul'}>`);continue}if(/^>\s?/.test(line)){const block=[];while(i<lines.length&&/^>/.test(lines[i]))block.push(lines[i++].replace(/^>\s?/,''));out.push('<blockquote>'+inline(block.join(' '))+'</blockquote>');continue}const p=[line];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|\s*```|\s*[-*+]\s|\s*\d+[.)]\s|>)/.test(lines[i])){if(lines[i].includes('|')&&i+1<lines.length&&lines[i+1].includes('---'))break;p.push(lines[i++])}out.push('<p>'+inline(p.join('\n')).replace(/\n/g,'<br>')+'</p>')}return {html:out.join(''),toc}}
function paintReader(anchor=''){if(!readerDoc)return;const d=readerDoc;$('reader-title').textContent=d.title;$('reader-path').textContent=d.path||d.relative;$('reader-meta').innerHTML=`<span>${esc(d.route_id)} · ${date(d.modified_at)} · ${(d.bytes||0).toLocaleString()} bytes</span><span>${d.tracked===false?'尚未跟踪 · HEAD 不能代表本文档':'原文快照'}</span><span class="hash">SHA256 ${esc(d.sha256||'—')}</span>`;$('reader-toggle').textContent=rawMode?'阅读视图':'查看原文';const parsed=markdown(d.content);$('reader-content').innerHTML=rawMode?'<textarea class="raw-document" readonly aria-label="Markdown 原文"></textarea>':parsed.html;if(rawMode)$('reader-content').querySelector('textarea').value=d.content;$('reader-toc').innerHTML=parsed.toc.map(h=>`<a href="#${esc(h.id)}" data-heading="${esc(h.id)}" style="padding-left:${Math.max(0,h.level-1)*8}px">${esc(h.title)}</a>`).join('');$('reader-scroll').scrollTop=0;if(anchor)requestAnimationFrame(()=>document.getElementById(anchor)?.scrollIntoView({block:'start'}))}
function openDoc(id,anchor=''){const d=allDocs().find(x=>x.id===id);if(!d){toast('引用文件未收录，请在对应工作树查看');return}if(!d.available){toast('来源不可读：'+d.error);return}readerDoc=d;rawMode=false;paintReader(anchor);if(!$('reader').open)$('reader').showModal()}
function resolveLink(url){if(!readerDoc)return;const [rawPath,rawAnchor='']=url.split('#'),anchor=decodeURIComponent(rawAnchor);if(!rawPath){document.getElementById(anchor)?.scrollIntoView({block:'start'});return}const path=decodeURIComponent(rawPath),parts=path.startsWith('/')?[]:readerDoc.relative.split('/').slice(0,-1);for(const item of path.split('/')){if(item==='..')parts.pop();else if(item&&item!=='.')parts.push(item)}const target=parts.join('/'),doc=docBy(readerDoc.route_id,target);if(doc)openDoc(doc.id,anchor);else toast('此引用未收录：'+target+'；请在原工作树查看')}
let refreshing=false;
async function refresh(){
 if(!data.live){location.href='http://127.0.0.1:8876/'+location.hash;return}
 if(refreshing)return;
 refreshing=true;
 const buttons=document.querySelectorAll('[data-action="refresh"]');
 buttons.forEach(b=>{b.disabled=true;b.textContent='正在生成…'});
 $('mode-label').textContent='正在执行 make research-hub…';
 try{
  const response=await fetch('/api/rebuild',{method:'POST',headers:{'X-OWAC-Hub':'1'},cache:'no-store'});
  const next=await response.json();
  if(!response.ok)throw Error(next.error||`HTTP ${response.status}`);
  if(next.schema_version!==1||!Array.isArray(next.routes))throw Error('invalid snapshot');
  data=next;render();
  if(readerDoc){const latest=allDocs().find(d=>d.id===readerDoc.id);if(latest?.available){readerDoc=latest;paintReader()}}
  toast('已自动执行 make research-hub，页面已更新');
 }catch(error){render();toast('自动生成失败，保留当前内容：'+error.message)}
 finally{refreshing=false}
}

document.addEventListener('click',event=>{const b=event.target.closest('button,a');if(!b)return;const d=b.dataset;if(d.nav){navigate(d.nav);return}if(d.routePrompt){navigate(d.routePrompt,'prompts');return}if(d.openPrompt){const [r,s]=d.openPrompt.split(':');navigate(r,'prompts',s);return}if(d.tab){state.tab=d.tab;state.filter='全部';history.replaceState(null,'','#'+new URLSearchParams({view:state.view,tab:state.tab,stage:state.stage}));render();return}if(d.stage){navigate(state.view,'prompts',d.stage);return}if(d.filter){state.filter=d.filter;render();return}if(d.doc){openDoc(d.doc);return}if(d.copyPath){copy(routeBy(d.copyPath).checkout,'已复制工作树路径');return}if(d.copyPrompt||d.downloadPrompt){const [rid,sid]=(d.copyPrompt||d.downloadPrompt).split(':'),r=routeBy(rid),s=r.stages.find(x=>x.id===sid);if(s.prompt.available){if(d.copyPrompt)copy(s.prompt.text,`已复制 ${rid} / ${sid} 完整交接包`);else saveFile(s.prompt.text,`OWAC_${rid}_${sid}_handoff.txt`)}return}if(d.copyCommand){copy(`cd ${data.repo}\nmake research-hub${d.copyCommand==='serve'?'-serve':''}\n`,'已复制命令');return}if(d.action==='refresh'){refresh();return}if(d.heading){event.preventDefault();document.getElementById(d.heading)?.scrollIntoView({block:'start'});return}if(d.sourceLink!==undefined){event.preventDefault();resolveLink(d.sourceLink)}});
$('search-form').addEventListener('submit',e=>e.preventDefault());$('global-search').addEventListener('input',e=>{state.query=e.target.value;state.view='documents';state.filter='全部';render()});$('reader-close').onclick=()=>$('reader').close();$('reader-toggle').onclick=()=>{rawMode=!rawMode;paintReader()};$('reader-copy').onclick=()=>copy(readerDoc.content,'已复制 Markdown 原文');$('reader-download').onclick=()=>saveFile(readerDoc.content,readerDoc.relative.split('/').pop());$('copy-close').onclick=()=>$('copy-dialog').close();$('reader').addEventListener('click',e=>{if(e.target===$('reader')){const r=$('reader').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('reader').close()}});window.addEventListener('hashchange',fromHash);fromHash();if(data.live)refresh();
})();
