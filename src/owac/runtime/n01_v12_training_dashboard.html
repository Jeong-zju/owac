<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N01 训练总览</title>
<style>
:root{color-scheme:light;--bg:#f4f6f9;--paper:#fff;--ink:#16243a;--muted:#68768a;--line:#e5eaf1;--blue:#315fe9;--teal:#008878;--red:#bd3b44;--amber:#a06c07}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}main{max-width:1150px;margin:auto;padding:36px 24px 26px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:28px;line-height:1.25;margin:0 0 8px}h2{font-size:19px;margin:0}.muted{color:var(--muted)}.tiny{font-size:12px}.pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:5px 12px;background:#e7f6ee;color:#187345;border-radius:99px;font-weight:600}.pill.wait{background:#fff3d8;color:var(--amber)}.pill.bad{background:#fbecee;color:var(--red)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.banner{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:20px 24px;background:#172d4f;color:white;border-radius:16px;margin-bottom:22px}.banner strong{font-size:20px}.banner .muted{color:#c2cee0}.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:23px;box-shadow:0 3px 15px #1a2a4410}.cardtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.kicker{color:var(--blue);font-weight:650;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.value{font-size:29px;font-weight:680;letter-spacing:-.6px;line-height:1.4}.value .unit{font-size:13px;font-weight:450;color:var(--muted);letter-spacing:0}.label{font-size:13px;color:var(--muted)}.progress{height:7px;border-radius:9px;background:#edf1f7;margin:15px 0 9px;overflow:hidden}.progress i{height:100%;background:var(--blue);display:block;border-radius:9px}.inline{display:flex;justify-content:space-between;gap:14px}.divider{height:1px;background:var(--line);margin:21px 0}.chart{height:180px;margin-top:12px;position:relative}.chart svg{width:100%;height:180px;overflow:visible}.placeholder{height:180px;display:grid;place-items:center;background:#fafbfd;border-radius:10px;color:var(--muted);font-size:13px;text-align:center;padding:20px}.legend{display:flex;gap:18px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px;background:#9aa9bb}.legend i.validation{background:var(--blue)}.effect{margin-top:11px;font-size:13px;color:var(--muted);min-height:23px}.gpu{padding:13px 15px;background:#f6f8fc;border-radius:10px;margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.gpu b{font-weight:650}.activity{margin-top:15px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer-card{margin-top:22px;padding:17px 22px;border:1px solid var(--line);background:white;border-radius:13px;font-size:13px}.footer-card .inline{align-items:center}details{margin-top:18px;color:var(--muted);font-size:12px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow:auto;max-height:220px;font-size:11px;background:#f7f8fb;padding:12px;border-radius:8px}.error{color:var(--red)}footer{font-size:12px;color:var(--muted);margin-top:20px;display:flex;justify-content:space-between;gap:12px}#connection{font-size:12px;color:var(--muted)}@media(max-width:760px){main{padding:22px 15px}header{align-items:flex-start}h1{font-size:23px}.banner{display:block;padding:18px}.banner .muted{margin-top:7px}.columns{grid-template-columns:1fr}.card{padding:20px}.footer-card .inline{display:block}.value{font-size:27px}footer{display:block}}
</style></head>
<body><main>
<header><div><h1>N01 训练总览</h1><div class="muted">只看状态、速度和效果。每 5 秒自动更新。</div></div><div id="connection">正在连接…</div></header>
<section class="banner"><div><strong id="overall">正在读取训练状态</strong><div class="muted tiny" id="summary">读取两张 Pro 6000 的实时数据</div></div><div class="muted tiny" id="plan">完整 32 帧 · 原生分辨率 · seed 101</div></section>
<div class="columns" id="cards"></div>
<section class="footer-card"><div class="inline"><div><b>机器人实际效果</b>　<span id="robotEffect" class="muted">尚未进行新模型闭环评测；验证误差下降不等于任务成功率提高。</span></div></div><div class="muted tiny" id="queue" style="margin-top:7px">训练队列：LIBERO → RoboTwin。Base 对照保留至后续阶段。</div><div id="probeVideo"></div></section>
<details><summary>查看运行细节与最近日志</summary><pre id="details">等待数据</pre><pre id="logs">等待日志</pre></details>
<footer><span id="footerNote">关闭页面或断开本机网络，不会停止服务器训练。</span><span id="timestamp">—</span></footer>
</main>
<script>
'use strict';
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,d=2)=>Number.isFinite(Number(x))&&x!==null&&x!==undefined?Number(x).toLocaleString('zh-CN',{maximumFractionDigits:d,minimumFractionDigits:d}):'—';
const integer=x=>Number.isFinite(+x)?Math.round(+x).toLocaleString('zh-CN'):'—';
function duration(seconds){if(!Number.isFinite(seconds)||seconds<=0)return '正在估算';const h=seconds/3600;return h>=48?`${num(h/24,1)} 天`:h>=1?`${num(h,1)} 小时`:`${Math.max(1,Math.round(seconds/60))} 分钟`;}
let lastStatus=null,lastMetrics=null;
function seriesFor(metrics,role,name){return(metrics?.series||[]).filter(s=>s.role===role&&s.name===name).flatMap(s=>s.points||[]).filter(p=>Number.isFinite(p.value)&&Number.isFinite(p.step)).sort((a,b)=>a.step-b.step);}
function plot(train,val){const all=[...train,...val];if(!all.length)return '<div class="placeholder">等待训练与验证数据<br>启动时会先测一次验证误差，作为起点。</div>';let lo=Math.min(...all.map(p=>p.value)),hi=Math.max(...all.map(p=>p.value));if(hi===lo){lo=Math.max(0,lo-.05);hi+=.05;}const pad=(hi-lo)*.12;lo=Math.max(0,lo-pad);hi+=pad;const maxStep=Math.max(1,...all.map(p=>p.step));const x=s=>42+(s/maxStep)*382,y=v=>145-((v-lo)/(hi-lo))*128;let out='<svg viewBox="0 0 440 180" role="img" aria-label="动作误差趋势，越低越好">';for(let i=0;i<3;i++){const v=lo+(hi-lo)*i/2;out+=`<line x1="42" y1="${y(v)}" x2="424" y2="${y(v)}" stroke="#e8edf4"/><text x="34" y="${y(v)+4}" text-anchor="end" fill="#8895a8" font-size="10">${num(v,3)}</text>`;}for(const [pts,color,width]of [[train,'#a7b4c5',1.5],[val,'#315fe9',2.5]]){if(pts.length>1)out+=`<path d="${pts.map((p,i)=>`${i?'L':'M'}${x(p.step)},${y(p.value)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="${width}"/>`;for(const p of pts.filter((_,i)=>i===pts.length-1||pts.length<25))out+=`<circle cx="${x(p.step)}" cy="${y(p.value)}" r="${color==='#315fe9'?3.3:1.5}" fill="${color}"><title>第${p.step}步：${p.value.toFixed(6)}</title></circle>`;}out+=`<text x="42" y="169" fill="#8895a8" font-size="10">第 0 步</text><text x="424" y="169" text-anchor="end" fill="#8895a8" font-size="10">第 ${integer(maxStep)} 步</text></svg>`;return out;}
function probeFor(role,status){return status.closed_loop_probe?.[role.toLowerCase()];}
function view(role,status,metrics){const probe=probeFor(role,status),probing=!!probe?.paused_training;const runs=(status.runs||[]).filter(r=>r.input_domain===role||r.method?.startsWith(role.toLowerCase()));const run=runs.find(r=>r.alive&&!r.finished)||runs.find(r=>r.state==='failed')||runs.at(-1);const gpu=(status.resources?.gpus||[]).find(g=>g.index===(role==='RAW'?0:1));const title=role==='RAW'?'RAW 模型':'同源 RGB 模型';if(!run)return `<article class="card"><div class="cardtop"><h2>${title}</h2><span class="pill wait"><i class="dot"></i>待启动</span></div><div class="muted" style="margin-top:22px">配置已登记，等待训练进程加载。</div><div class="placeholder" style="margin-top:20px">尚无新模型的训练结果</div></article>`;
const activity=probing?`正在评测第 ${probe.checkpoint_step} 步检查点，已完成 ${probe.completed}/${probe.selected} 次`:(run.exit_reason||run.activity||'正在训练');const step=run.step||0,total=run.planned_steps||50000,failed=!probing&&(run.state==='failed'||run.suspicious),complete=run.finished&&!failed,loading=run.phase==='loading';const isValidating=String(run.activity||'').includes('验证');const state=run.state==='stopped'?'已停止':probing?(probe.state==='resuming'?'恢复训练中':'闭环验证中'):failed?'需要处理':complete?'已结束':loading?'加载中':isValidating?'验证中':'训练中';const cls=failed?'bad':probing||loading||isValidating?'wait':'';const phase=run.phase==='backend_adaptation'?'第 2 阶段 · 联合适配动作后端':loading?'准备数据与模型':'第 1 阶段 · 学习视觉和对应';let train=seriesFor(metrics,run.role,'train_action_loss'),val=seriesFor(metrics,run.role,'val_action_loss');const latest=val.at(-1),base=val[0];let effect=!latest?'尚未完成验证，暂不能判断效果。':val.length===1?'已测出起点误差，等待训练后的验证。':`验证误差较起点${latest.value<base.value?'降低':'升高'} ${num(Math.abs(latest.value-base.value)/Math.max(Math.abs(base.value),1e-12)*100,1)}%；这是动作预测误差，尚不是机器人成功率。`;
const speed=run.state==='stopped'?0:Number(run.step_seconds),eta=!failed&&!complete&&speed>0?duration((total-step)*speed):'—';const platform=run.platform==='robotwin2'?'RoboTwin':'LIBERO';const stalled=!probing&&run.alive&&run.step_progress_at&&Date.now()/1000-run.step_progress_at>900&&!loading;
return `<article class="card"><div class="cardtop"><h2>${title}</h2><span class="pill ${cls}"><i class="dot"></i>${stalled?'长时间未推进':state}</span></div><div class="muted tiny">${platform} · ${phase}</div><div class="stats"><div><div class="label">训练进度</div><div class="value">${integer(step)} <span class="unit">/ ${integer(total)} 步</span></div></div><div><div class="label">训练速度</div><div class="value">${speed>0?num(speed,1):'—'} <span class="unit">秒 / 步</span></div><div class="tiny muted">${speed>0?`${integer(3600/speed)} 步 / 小时 · ${num(run.samples_per_second,2)} 样本 / 秒`:run.state==='stopped'?'已停止，不再计速':'完成初始验证后开始测量'}</div></div></div><div class="progress"><i style="width:${Math.max(0,Math.min(100,100*step/total))}%"></i></div><div class="inline tiny muted"><span>${num(100*step/total,2)}% · 预算进度</span><span>此任务剩余约 ${eta}</span></div><div class="divider"></div><div class="inline"><div><div class="label">验证误差 <span class="tiny">越低越好</span></div><div class="value">${latest?num(latest.value,4):'—'}</div></div><div style="text-align:right"><div class="label">最近验证</div><div class="tiny muted">${latest?`第 ${integer(latest.step)} 步`:'等待首次验证'}</div></div></div><div class="chart">${plot(train,val)}</div><div class="legend"><span><i></i>训练误差</span><span><i class="validation"></i>固定验证误差</span></div><div class="effect">${effect}</div><div class="gpu"><div class="tiny">GPU ${gpu?.index??'—'} 工作强度<br><b>${gpu?`${integer(gpu.utilization_pct)}%`:'未读取'}</b></div><div class="tiny">显存 / 功耗<br><b>${gpu?`${num(gpu.memory_used_mib/1024,1)} / ${num(gpu.memory_total_mib/1024,0)} GB`:'—'}</b> ${gpu?.power_w?`<span class="muted">· ${integer(gpu.power_w)} W</span>`:''}</div></div><div class="activity ${failed?'error':''}" title="${esc(activity)}">${esc(activity)}</div></article>`;}
function render(status,metrics){lastStatus=status;lastMetrics=metrics;const runs=status.runs||[],live=runs.filter(r=>r.alive&&!r.finished),bad=runs.filter(r=>!probeFor(r.input_domain||'',status)?.paused_training&&(r.suspicious||r.state==='failed'));const probes=Object.values(status.closed_loop_probe||{}),probing=probes.some(p=>p.paused_training);if(probes.length)$('robotEffect').textContent=probes.map(p=>`${p.role==='raw'?'RAW':'RGB'}：${p.completed>0?`成功 ${p.successes}/${p.completed}，已完成 ${p.completed}/${p.selected}`:p.state==='failed'?'评测中断':p.state==='waiting_checkpoint'?`等待保存后评测（计划 ${p.selected} 次）`:`准备评测（计划 ${p.selected} 次）`}`).join('；')+'。开发小测，场景可能与训练集重合。';$('overall').textContent=status.state==='stopped'?'训练已停止':probing?'闭环小测进行中':bad.length?'有训练任务需要处理':live.length?`两卡并行 · ${live.length} 个任务运行中`:runs.length?'当前训练任务已结束':'训练正在准备';$('footerNote').textContent=status.state==='stopped'?'当前训练已停止，已有结果仍可查看。':'关闭页面或断开本机网络，不会停止服务器训练。';$('queue').textContent=status.state==='stopped'?'训练已停止；后续 RoboTwin 队列不会启动。':'训练队列：LIBERO → RoboTwin。Base 对照保留至后续阶段。';$('summary').textContent=status.state==='stopped'?'已按你的要求停止 RAW 与 RGB，检查点和评测结果已保留。':probing?'两模型各评测相同的 12 个场景；各卡完成后自动续训。':bad.length?'下方会显示具体原因；保留检查点和原始日志。':live.length?'RAW 与同源 RGB 分别训练，曲线独立记录。':'等待训练进程登记状态。';$('cards').innerHTML=['RAW','RGB'].map(r=>view(r,status,metrics)).join('');$('timestamp').textContent=`服务器更新：${new Date(status.updated_at).toLocaleString('zh-CN',{hour12:false})}`;const clip=(status.artifacts||[]).find(a=>a.kind==='paired_closed_loop_preview'),holder=$('probeVideo');if(clip&&holder.dataset.url!==clip.url){holder.dataset.url=clip.url;holder.innerHTML=`<details><summary>查看正常光同场景回放（左 RAW / 右 RGB）</summary><video controls preload="none" src="${esc(clip.url)}" style="width:100%;max-width:700px;margin-top:12px;border-radius:8px"></video><div class="tiny muted">按策略查询抽帧，使用同一显示处理；任务是把白杯放到盘上，并把巧克力布丁放到盘右侧。</div></details>`;}$('details').textContent=JSON.stringify({runs:status.runs,gpus:status.resources?.gpus,closed_loop_probe:status.closed_loop_probe,training_plan:status.training_plan},null,2);$('logs').textContent=(status.recent_log||[]).slice(-12).map(l=>`${l.ts||''} ${l.message||l.text||JSON.stringify(l)}`).join('\n')||'无额外日志';}
let running=false;async function refresh(){if(running)return;running=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);try{const [status,metrics]=await Promise.all(['/api/status','/api/metrics'].map(async p=>{const r=await fetch(p,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json();}));render(status,metrics);$('connection').textContent='● 已连接';$('connection').style.color='#187345';}catch(e){$('connection').textContent='连接中断 · 自动重试';$('connection').style.color='#bd3b44';$('summary').textContent='本机连接暂时中断；页面上的数据可能已过时，服务器训练不受此影响。';}finally{clearTimeout(timeout);controller.abort();running=false;}}refresh();setInterval(refresh,5000);
</script></body></html>
