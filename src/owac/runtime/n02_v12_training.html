<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N02 · 训练监控</title>
<style>
:root{color-scheme:light;--ink:#172b29;--muted:#687977;--line:#dce5e0;--green:#126c50;--blue:#366dd5;--red:#b84435}*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}main{max-width:1180px;margin:0 auto;padding:40px 28px 24px}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--green);letter-spacing:2px;font-weight:700}h1{font-size:32px;margin:5px 0 4px;letter-spacing:-1px}p{margin:0;color:var(--muted)}.live{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;background:#25a675;border-radius:50%}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card,.chartbox{background:white;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 4px 18px #14302604}.cardtop{display:flex;justify-content:space-between;align-items:center}h2{margin:0;font-size:20px}.badge{border-radius:24px;background:#edf7f1;color:var(--green);padding:5px 12px;font-size:12px;font-weight:700}.badge.error{background:#fcece8;color:var(--red)}.badge.wait{color:#6c746c;background:#f0f2f0}.phase{font-size:13px;min-height:22px;color:var(--muted);margin-top:8px}.progressline{display:flex;justify-content:space-between;margin:23px 0 9px;font-size:13px}.progressline strong{font-size:20px;font-variant-numeric:tabular-nums}.bar{height:7px;border-radius:8px;background:#edf0ed;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:width .5s}.blue .bar i{background:var(--blue)}.numbers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}.label{font-size:12px;color:var(--muted)}.value{font-size:29px;line-height:1.35;font-variant-numeric:tabular-nums;font-weight:650;letter-spacing:-.5px}.unit{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.improve{font-size:12px;min-height:20px;color:var(--green)}.worse{color:var(--red)}.gpu{border-top:1px solid #edf0ed;margin-top:22px;padding-top:16px;display:flex;gap:12px;justify-content:space-between;font-size:12px;color:var(--muted)}.gpu strong{color:var(--ink)}.chartbox{margin-top:22px;padding-bottom:16px}.charthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.charthead h2{font-size:17px}.legend{display:flex;gap:16px;color:var(--muted);font-size:12px}.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.legend span:last-child:before{background:var(--blue)}svg{display:block;width:100%;height:230px}.empty{display:flex;align-items:center;justify-content:center;height:230px;color:var(--muted);font-size:14px}.foot{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--muted);gap:16px}a{color:var(--muted);text-decoration:none}a:hover{text-decoration:underline}#connection{padding:10px 14px;background:#fff1df;color:#8c5b1c;border-radius:10px;margin-bottom:18px;display:none}details{font-size:12px;color:var(--muted);margin-top:18px}summary{cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;background:#f6f8f5;padding:12px;border-radius:8px}.muted{color:var(--muted)}@media(max-width:760px){main{padding:24px 16px}.cards{grid-template-columns:1fr}.top{display:block}.live{margin-top:12px}.card{padding:21px}h1{font-size:28px}.foot{display:block}.foot a{display:inline-block;margin-top:8px}.charthead{display:block}.legend{margin-top:8px}}
</style></head><body><main>
<header class="top"><div><div class="eyebrow" id="phase">N02 · 实验进行中</div><h1>训练监控</h1><p>看状态、看速度、看效果。</p></div><div class="live"><i class="dot" id="dot"></i><span id="refresh">正在连接训练服务器…</span></div></header>
<div id="connection" role="status"></div><article class="card" id="closed-loop-status" hidden style="margin-bottom:22px"></article><section class="cards" id="cards"><div class="card">正在读取真实训练记录…</div></section>
<section class="chartbox"><div class="charthead"><h2><span id="metric-title">训练代理误差</span> <span class="unit">越低越好</span></h2><div class="legend"><span>当前模型</span><span>对照模型</span></div></div><div id="chart" class="empty">完成首次验证后显示曲线</div><p class="sub" id="metric-caption">固定4个验证窗口与随机输入；测量给定噪声时的速度预测误差，不是完整采样的动作误差。</p></section>
<footer class="foot"><span id="metric-foot">该曲线是32维速度预测误差，含18维补零，不能代表抓取效果；闭环见视频页。</span><span><a href="/closed-loop">看光照闭环视频 ↗</a>　<a href="/details">查看详细记录 ↗</a></span></footer>
</main><script>
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,d=1)=>x===null||x===undefined||!Number.isFinite(Number(x))?'—':Number(x).toFixed(d);
function duration(x){if(x===null||x===undefined)return'正在估算';const m=Math.max(1,Math.round(x/60));return m>=60?`${Math.floor(m/60)} 小时 ${m%60} 分`:`约 ${m} 分钟`}
function state(r){if(r.state==='stopped')return['已停止','wait'];if(r.state==='evaluating')return['闭环验收中',''];if(['failed','error','crashed'].includes(r.state))return['异常停止','error'];if(['completed','complete','done'].includes(r.state))return r.training_fit&&!r.training_fit.passed?['拟合未通过','error']:['训练完成',''];if(r.stale&&r.state==='running')return['心跳中断','error'];if(r.state==='running')return['训练中',''];if(r.state==='initialising')return['准备中','wait'];return['等待启动','wait']}
function card(r,i){const fit=r.training_fit,fitCurve=r.training_fit_curve||[],fitStart=fitCurve.find(p=>p.step===0),[label,cls]=state(r),dev=fit?{step:fit.step,error:fit.maxima.joint_rms_deg}:r.latest_dev,im=fit&&fitStart?100*(fitStart.error-dev.error)/fitStart.error:r.improvement_percent,g=r.gpu?.[0],best=(fit?fitCurve:r.curve||[]).reduce((b,p)=>!b||p.error<b.error?p:b,null),pct=Math.min(100,Math.max(0,100*r.step/r.target));return `<article class="card ${i?'blue':''}"><div class="cardtop"><h2>${esc(r.label)}</h2><span class="badge ${cls}">${label}</span></div><div class="phase">${esc(r.activity)}</div><div class="progressline"><span><strong>${r.step.toLocaleString()}</strong> / ${r.target.toLocaleString()} 步</span><span>${['completed','stopped'].includes(r.state)?'本轮已结束':r.state==='evaluating'?'训练完成，闭环验收中':'剩余 '+duration(r.eta_seconds)}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="numbers"><div><div class="label">训练速度</div><div class="value">${num(r.samples_per_minute,1)} <span class="unit">样本/分钟</span></div><div class="sub">${num(r.seconds_per_update,2)} 秒 / 更新</div></div><div><div class="label">${esc(fit?"训练样本关节误差（°）":r.metric_label||"当前训练代理误差")}</div><div class="value">${num(dev?.error,fit?1:4)}</div><div class="improve ${im<0?'worse':''}">${im===null?'等待初始验证':im>=0?'比初始降低 '+num(im,1)+'%':'比初始升高 '+num(-im,1)+'%'}</div><div class="sub">${r.selected_checkpoint_step?'闭环选用：第 '+r.selected_checkpoint_step+' 步':dev?'最近验证：第 '+dev.step+' 步':'等待首次验证'}</div><div class="sub">${best?'本轮最佳：'+num(best.error,fit?1:4)+' · 第 '+best.step+' 步':''}</div>${r.state==='completed'&&best&&dev&&best.error>0&&dev.error>best.error?`<div class="sub worse">末次比最佳高 ${num(100*(dev.error/best.error-1),1)}%</div>`:''}</div></div>${r.metric_kind==='raw_representation'?`<div class="sub">图像位置对应：<strong>${num(r.representation_metrics?.crop_match_accuracy*100,1)}%</strong> · ${r.representation_metrics?.representation_gate_passed?'表征检查通过':'表征仍待验收'}</div>`:`<div class="sub">独立留出动作误差：<strong>${num(r.sampled_control_mse,4)}</strong> · 以闭环成败验收</div>`}${r.task_control?`<div class="sub">正常光开场：<strong>${num(r.task_control.strata?.["Normal/opening"]?.mse,4)}</strong> · 夹爪误差：${num(r.task_control.gripper_mse,4)}</div>`:""}${r.training_fit?`<div class="sub ${r.training_fit.passed?"":"worse"}"><strong>训练样本拟合：${r.training_fit.passed?"通过":"未通过"}</strong> · 第 ${r.training_fit.step} 步</div><div class="sub">最差窗口关节误差 ${num(r.training_fit.maxima.joint_rms_deg,1)}° / 目标 ${num(r.training_fit.limits.joint_rms_deg,0)}° · 夹爪误差 ${num(r.training_fit.maxima.gripper_mae,3)} / 目标 ${num(r.training_fit.limits.gripper_mae,2)}</div><div class="sub">第一条关节最大误差 ${num(r.training_fit.maxima.first_joint_max_deg,1)}° / ${num(r.training_fit.limits.first_joint_max_deg,0)}° · 夹爪最大误差 ${num(r.training_fit.maxima.gripper_max_error,3)} / ${num(r.training_fit.limits.gripper_max_error,2)}</div><div class="sub">${r.training_fit.evaluations}组训练窗口与采样种子检查；通过后才进入抓取复验。</div>`:""}${r.action_validation?`<div class="sub ${r.action_validation.passed===false?"worse":""}">${esc(r.action_validation.label)}${Number.isFinite(r.action_validation.normal_opening_change_percent)?` · 正常光开场 ${r.action_validation.normal_opening_change_percent>0?"升高":"降低"}${num(Math.abs(r.action_validation.normal_opening_change_percent),1)}%`:""}</div>`:""}<div class="gpu"><span>Pro 6000 · GPU ${g?esc(g.index):i}</span><span>利用率 <strong>${num(g?.utilization,0)}%</strong> · 显存 <strong>${num(g?g.memory_used_mib/1024:null,1)} GiB</strong></span></div><details><summary>训练详情</summary><pre>当前损失：${num(r.loss,5)}\n留出动作误差初始值：${num(r.baseline_dev,5)}\n留出动作误差最佳值：${num(r.best_dev,5)}\n作业：${esc(r.run_id)}\n最近保存：${esc(r.checkpoint||'尚未到保存点')}</pre></details></article>`}
function chart(runs,target=null){const all=runs.flatMap(r=>r.curve||[]).filter(p=>Number.isFinite(p.error));if(!all.length){$('chart').className='empty';$('chart').textContent='完成首次验证后显示曲线';return}const W=1000,H=230,L=62,R=20,T=12,B=34,xMax=Math.max(50,...all.map(p=>p.step)),lo=Math.min(...all.map(p=>p.error),...(Number.isFinite(target)?[target]:[])),hi=Math.max(...all.map(p=>p.error)),pad=Math.max((hi-lo)*.15,.002),yLo=Math.max(0,lo-pad),yHi=hi+pad,x=s=>L+s/xMax*(W-L-R),y=e=>T+(yHi-e)/(yHi-yLo)*(H-T-B);let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="当前训练的真实代理误差曲线">`;for(let i=0;i<4;i++){const v=yLo+(yHi-yLo)*i/3,Y=y(v);svg+=`<line x1="${L}" y1="${Y}" x2="${W-R}" y2="${Y}" stroke="#eaf0ea"/><text x="${L-10}" y="${Y+4}" text-anchor="end" fill="#75837b" font-size="11">${v.toFixed(Number.isFinite(target)?1:3)}</text>`}if(Number.isFinite(target)){svg+=`<line x1="${L}" y1="${y(target)}" x2="${W-R}" y2="${y(target)}" stroke="#b84435" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(target)-5}" text-anchor="end" fill="#b84435" font-size="11">关节目标 ${target}°</text>`}for(let i=0;i<=4;i++){const s=Math.round(xMax*i/4);svg+=`<text x="${x(s)}" y="${H-8}" text-anchor="middle" fill="#75837b" font-size="11">${s} 步</text>`}runs.forEach((r,i)=>{const pts=(r.curve||[]).filter(p=>Number.isFinite(p.error)).sort((a,b)=>a.step-b.step),c=i?'#366dd5':'#126c50';if(!pts.length)return;svg+=`<polyline points="${pts.map(p=>`${x(p.step)},${y(p.error)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/>`;pts.forEach(p=>svg+=`<circle cx="${x(p.step)}" cy="${y(p.error)}" r="3.5" fill="${c}"><title>${esc(r.label)} · 第 ${p.step} 步：${p.error.toFixed(5)}</title></circle>`)});$('chart').className='';$('chart').innerHTML=svg+'</svg>'}
async function refresh(){try{const res=await fetch('/api/training',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();const rep=d.runs.some(r=>r.metric_kind==='raw_representation'),sampled=d.runs.some(r=>r.metric_kind==='sampled_control');$('metric-title').textContent=rep?'RAW局部重建误差':d.runs.some(r=>r.sampled_metric==='balanced_sampled_prefix14_mse')?'前10步动作误差':sampled?'完整采样动作误差':'训练代理误差';$('metric-caption').textContent=rep?'开发分区真实RAW，检查局部内容能否被保留；图像位置对应检查裁剪后的真实坐标。':sampled?'固定4个开发窗口，从噪声完整采样50步动作；归一化空间MSE，越低越好。':'固定4个验证窗口与随机输入；测量给定噪声时的速度预测误差，不是完整采样的动作误差。';$('metric-foot').textContent=rep?'当前先恢复视觉表征，通过验收后再适配π0.5；这些指标不是抓取成功率。':sampled?'动作误差不是成功率；抓取效果看实际接触与持续抓持。':'该曲线是32维速度预测误差，含18维补零，不能代表抓取效果；闭环见视频页。';if(rep){$('closed-loop-status').hidden=false;$('closed-loop-status').innerHTML='<h2>第一步：恢复RAW视觉表征</h2><p>正在比较深层重建与全部重建。先检查图像内容和位置对应，再进行后端适配。当前尚未证明抓取成功。</p><a href="/closed-loop">查看此前闭环与误判复核 ↗</a>';}if(d.phase==='raw_fusion'){$('closed-loop-status').hidden=false;$('closed-loop-status').innerHTML=`<h2>第二步：重训多尺度融合与通道映射</h2><p>${esc(d.phase_detail||"RAW编码器已通过表征检查并冻结。正在训练融合读出，π0.5后端保持冻结；下一步再决定后端适配。")}</p><a href="/closed-loop">查看此前闭环与误判复核 ↗</a>`;}else if(d.phase==='backend'){$('closed-loop-status').hidden=false;$('closed-loop-status').innerHTML=`<h2>第三步：适配π0.5后端</h2><p>${esc(d.phase_detail||'从通过图像检查的RAW编码器及已训练的融合读出继续训练，比较后端适配与冻结后端对照。抓取效果仍以真实闭环验收。')}</p><a href="/closed-loop">查看闭环验收 ↗</a>`;}const c=d.closed_loop?.successful_case;if(!rep&&c){$('closed-loop-status').hidden=false;$('closed-loop-status').innerHTML=`<h2>RAW 已完成真实闭环 · ${c.num_steps} 步</h2><p>正常光、固定初态；成功权重为迁移臂第 ${c.step} 步。本轮 ${d.closed_loop.completed} 回合中成功 ${d.closed_loop.success} 回合（含同一权重复跑）。训练已停止。</p><a href="/closed-loop" style="color:var(--green)">观看成功视频 ↗</a><div class="sub">开发验收，尚未证明光照鲁棒性或稳定成功率。</div>`;}if(!rep&&d.closed_loop?.benchmark_success>d.closed_loop?.success){$('closed-loop-status').hidden=false;$('closed-loop-status').innerHTML='<h2>先前的抓取成功结论已撤回</h2><p>物理复核已确认误判：触桌、无夹爪接触，随后掉落。加入动作衔接约束后真实RAW复验400步仍失败，持续抓持0秒。当前未完成抓取，训练已停止。</p><a href="/closed-loop">查看原始视频与复核记录 ↗</a>';}if(d.phase==='task_adaptation'){$('closed-loop-status').hidden=false;$('closed-loop-status').innerHTML=`<h2>学习任务表征与动作适配</h2><p>${esc(d.phase_detail)}</p><div class="sub">本轮效果看动作验证与真实抓持。暗光暂无独立任务验证集；传感器噪声另做固定画面对照。</div><a href="/closed-loop">查看真实闭环 ↗</a>`;$('metric-caption').textContent=d.runs.some(r=>r.sampled_metric==='balanced_sampled_prefix14_mse')?'覆盖留出集5段演示的20个窗口，检查实际使用的前10步动作，并单独约束关节、夹爪及执行变换后的离线误差。':'覆盖留出集全部5段演示的20个窗口：开场、接近、中段、末段；按光照和阶段汇总14维完整采样动作误差。';$('metric-foot').textContent='正常光开场单独检查；任务误差降低仍不等于抓取成功。低光、极低光、极过曝验证缺失。';}if(d.phase==='fewshot_fit'){$('closed-loop-status').hidden=false;$('closed-loop-status').innerHTML=`<h2>第二步：先学会少量示范</h2><p>${esc(d.phase_detail)}</p><div class="sub">训练样本拟合与独立留出误差分别显示。未通过拟合门槛时，不进入下一步闭环。</div><a href="/closed-loop">查看第一步视频与历史闭环 ↗</a>`;$('metric-title').textContent='训练样本关节误差（°）';$('metric-caption').textContent='每条示范4个位置、4个采样种子，显示其中最差窗口的关节均方根误差。关节目标3°；通过还需首条动作和夹爪同时达标。';$('metric-foot').textContent='当前检查训练样本是否学会；训练完成或误差降低均不代表抓取成功。';}document.querySelector('.legend').innerHTML=d.runs.map(r=>`<span>${esc(r.label)}</span>`).join('');$('cards').innerHTML=d.runs.length?d.runs.map(card).join(''):'<div class="card">训练配置准备中，尚未启动。</div>';$('refresh').textContent='实时更新 · '+new Date().toLocaleTimeString('zh-CN');$('dot').style.background='#25a675';$('connection').style.display='none';$('phase').textContent=d.runs.length&&d.runs.every(r=>['completed','complete','done','stopped'].includes(r.state))?'N02 · 本轮训练已结束':'N02 · 实验进行中';const fitPhase=d.phase==='fewshot_fit';chart(fitPhase?d.runs.map(r=>({...r,curve:r.training_fit_curve||[]})):d.runs,fitPhase?3:null)}catch(e){$('connection').style.display='block';$('connection').textContent='暂时无法连接监控服务器，正在重试。页面保留上次记录。';$('dot').style.background='#c79142'}finally{setTimeout(refresh,4000)}}refresh();
</script></body></html>
