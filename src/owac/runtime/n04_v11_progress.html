<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,"><title>N04 v1.1 · 训练监控</title>
<style>
:root{color-scheme:light;--bg:#f3f5f7;--card:#fff;--ink:#14252a;--muted:#607078;--line:#e1e7e9;--green:#087c69;--blue:#346bbb;--orange:#a36916;--red:#bf3f44}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:24px 28px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:22px;margin:0}h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 8px}p{margin:0}.sub,.muted{color:var(--muted);font-size:13px}.live{font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block}.connection{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px 25px;box-shadow:0 3px 15px #243c4b04}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.label{font-size:11px;letter-spacing:1.5px;color:var(--muted);font-weight:650}.pill{font-size:12px;border-radius:30px;padding:4px 11px;background:#e6f5f0;color:var(--green);font-weight:600}.pill.wait{background:#edf1f6;color:#5f7185}.pill.bad{background:#fbe9ea;color:var(--red)}.pill.warn{background:#fff3e0;color:var(--orange)}.section{padding-top:15px;margin-top:15px;border-top:1px solid var(--line)}.big{font-size:36px;font-weight:680;line-height:1.3;letter-spacing:-1px;font-variant-numeric:tabular-nums}.big small{font-size:15px;letter-spacing:0;font-weight:400;color:var(--muted);margin-left:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.caption{font-size:12px;color:var(--muted);margin-top:6px}.progress{height:6px;border-radius:10px;background:#ecf0f1;margin:12px 0 7px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.change{font-size:14px;color:var(--green);font-weight:600}.change.bad{color:var(--orange)}.aux{display:grid;grid-template-columns:1fr 1fr;gap:18px}.aux .value{font-size:23px;font-weight:650;font-variant-numeric:tabular-nums}.aux .chart-wrap{height:82px;margin-top:5px}.chart-wrap{height:105px;position:relative;margin-top:12px}canvas{height:100%;width:100%;display:block}.legend{font-size:11px;color:var(--muted);display:flex;gap:16px;margin-top:5px}.legend i{width:13px;height:3px;display:inline-block;vertical-align:middle;margin-right:5px}.gpu{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}.gpu .card{padding:17px 24px}.meter{height:5px;background:#e8edf0;border-radius:8px;width:110px;overflow:hidden}.meter i{height:100%;display:block;background:var(--blue)}.gpu-value{font-variant-numeric:tabular-nums;font-weight:650}.foot{margin-top:22px;font-size:12px;color:var(--muted)}.notice{background:#fff7e8;color:#835719;padding:12px 18px;border:1px solid #f0dfbc;border-radius:12px;margin-bottom:20px;font-size:13px}.error{margin-top:14px;padding:10px 12px;background:#fbecee;color:var(--red);font-size:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:24px;font-size:12px;color:var(--muted)}summary{cursor:pointer}pre{padding:14px;background:#eef2f4;border-radius:9px;max-height:230px;overflow:auto;white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace}button{background:white;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.empty{color:var(--muted);text-align:center;padding:50px 10px}#banner[hidden]{display:none}@media(max-width:750px){main{padding:22px 16px}.grid,.gpu{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:24px}.card{padding:22px}.big{font-size:32px}.live{flex-wrap:wrap;justify-content:flex-end}.connection{width:100%;text-align:right}}
</style>
</head><body><main>
<header><div><div class="label">OWAC / N04</div><h1>训练监控</h1><p class="sub">由 Codex 管理 · LIBERO 与 RoboTwin 独立训练</p></div><div class="live"><span class="dot" id="dot"></span><span id="connection">连接中</span><button id="refresh" type="button">刷新</button><span class="connection" id="clock"></span></div></header>
<div class="notice" id="banner" hidden></div><div id="repair" class="banner" hidden></div><div class="grid" id="models"><div class="card empty">正在读取训练状态…</div></div><div class="gpu" id="gpus"></div>
<p class="foot">验证动作误差越低越好。曲线变平不等于已收敛，需结合预热进度、验证覆盖和最佳值判断；机器人任务成功率以闭环评测为准。</p>
<details><summary>查看运行详情与日志</summary><div id="details"></div></details>
</main><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=1)=>Number.isFinite(v)?v.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
let snapshot=null,lastOkay=0;
const auxSpecs=[['forecast','预测辅助损失','0.1'],['repr','表征辅助损失','0.01']];
function objectiveStatus(r){
 const coverage=r.activity?.objective_coverage;
 if(coverage){const names=Object.keys(coverage),active=names.filter(n=>coverage[n].windows>0&&coverage[n].valid_items>0);return `<p class="caption${active.length<names.length?' bad':''}">训练目标：${active.length} / ${names.length} 项参与本次更新</p>`;}
 const missing=[['forecast','预测'],['corr','对应']].filter(([key])=>{const last=r.series?.[key]?.at(-1);return last&&(r.train_step??r.step??0)-last[0]>50;}).map(([,name])=>name);
 return missing.length?`<div class="error">训练目标缺项：${missing.join('、')}已有超过50步未记录，不能按完整训练解释。</div>`:'';
}
function auxiliary(r,i){const a=r.assessment||{},fixed=r.activity?.auxiliary_validation,h=fixed?.forecast?.['4'],rep=fixed?.representation,independent=a.representation_mode==='independent_windows';const ratio=h?.persistence_mse>0?h.prediction_mse/h.persistence_mse:null;return `<div class="section">${objectiveStatus(r)}<div class="aux">${auxSpecs.map(([key,label,weight])=>{const points=r.series?.[key]||[],last=points.at(-1),actualWeight=a.loss_weights?.[key==='repr'?'representation':key]??weight;return `<div><h3>${label}</h3><div class="value">${num(last?.[1],4)}</div><div class="chart-wrap"><canvas id="aux-${key}-${i}" aria-label="${label}曲线"></canvas></div><p class="caption">原始值 · 总损失权重 ${actualWeight}${last?' · 第 '+last[0]+' 步':''}</p></div>`;}).join('')}</div>${independent?'<p class="caption">本轮表征项采用跨序列统计，数值与旧轮不同，不拼接比较。</p>':''}${fixed?`<p class="caption">固定验证 · 第 ${fixed.step} 步：四步预测误差 / 保持状态误差 ${num(ratio,2)} 倍（低于 1 表示更好）<br>跨序列表征变化 ${num(rep?.std,4)} · ${fixed.windows} 段序列</p>`:''}<p class="caption">辅助项来自训练序列，各图独立刻度；不能据此判断任务成功或整体收敛。</p></div>`;}


function status(r){const phase=String(r?.phase||'');if(phase==='error')return['训练异常','bad'];if(phase==='done')return['本轮已完成','wait'];if(phase==='profiling')return['性能验证中','wait'];if(phase==='diagnosing')return['已暂停 · 辅助项排查','warn'];if(phase==='stopped_by_user')return['已停止','wait'];if(r?.job?.status!=='running')return[r?.step>0?'作业已停止':'等待启动','wait'];if(phase==='representation_cache')return['准备表征批次','wait'];if(phase==='validate'||phase==='eval')return['验证效果中','wait'];if(phase==='saving')return['保存权重中','wait'];if(['initializing','loading'].includes(phase))return['载入模型中','wait'];if(r.owner==='Codex'&&r.step_seconds_reported==null)return['预热训练中','wait'];if(Number.isFinite(r.data_age_s)&&r.data_age_s>180)return['较久未更新','warn'];return['正常训练',''];}
const phaseOf=r=>String(r?.phase||'');
function latestRuns(data){return ['libero','robotwin'].map(p=>(data.runs||[]).filter(r=>r.platform===p).sort((a,b)=>(b.updated_at_epoch||0)-(a.updated_at_epoch||0))[0]||{platform:p,job:{status:'empty'},series:{}});}
function render(){if(!snapshot)return;const repair=snapshot.repair;$('repair').hidden=!repair;if(repair)$('repair').textContent='正在验证修复 · 不计正式训练进度　'+repair.runs.map(r=>(r.platform==='libero'?'LIBERO':'RoboTwin')+' '+num(r.step,0)+' / '+num(r.budget,0)+(r.phase==='error'?' · 验证未通过':r.reload_verified?' · 重载已验证':r.phase==='done'?' · 重载检查中':'')).join('　');const runs=latestRuns(snapshot);$('models').innerHTML=runs.map((r,i)=>{const s=status(r),step=r.train_step??r.step??0,budget=r.train_budget_steps??r.budget_steps,act=r.activity||{},assessment=r.assessment||{},speed=r.step_seconds,dev=r.dev_loss,baseline=act.initial_dev_loss??r.series?.dev?.[0]?.[1],improvement=Number.isFinite(dev)&&baseline>0?(baseline-dev)/baseline*100:null;const pct=budget>0?Math.min(100,step/budget*100):0;let detail='';if(['正常训练','预热训练中','准备表征批次'].includes(s[0])&&act.total_windows)detail=`本步已处理 ${act.completed_windows||0} / ${act.total_windows} 段序列`;else if(phaseOf(r)==='diagnosing')detail='检查点已保留，正在用固定样本定位问题';else if(s[0]==='性能验证中')detail='正在比较加速方案，已保存恢复断点';else if(s[0]==='验证效果中')detail='使用固定开发集，正在检查动作预测';else if(s[0]==='载入模型中')detail='正在读取模型权重与训练数据';else if(s[0]==='保存权重中')detail='正在保存可恢复的训练断点';else detail=step?'等待下一次更新':'尚未执行优化器更新';const completed=r.eval?.completed,success=r.eval?.successes;const closed=completed>0?`${success} / ${completed} 次成功`:'尚未评测';const gpu=(snapshot.gpu||[]).find(g=>g.index===(r.gpu_index??i));return `<article class="card"><div class="card-head"><div><div class="label">GPU ${i} · PRO 6000</div><h2>${i===0?'LIBERO':'RoboTwin'}</h2></div><span class="pill ${s[1]}">${s[0]}</span></div><div class="between caption" style="margin-bottom:16px"><span>GPU 忙碌度 ${num(gpu?.util_percent,0)}%</span><span>显存 ${num(gpu?.used_gb,1)} / ${num(gpu?.total_gb,1)} GiB · ${num(gpu?.power_w,0)} W</span></div>${assessment.compiled_modules?.length?`<p class="caption" style="margin-top:-12px;margin-bottom:14px;color:var(--green)">编译加速已开启${assessment.compiled_modules.includes('forecast_diagnostics')?' · 预测诊断已合并编译':''}</p>`:''}<h3>训练进度</h3><div class="big">${num(step,0)}<small>/ ${num(budget,0)} 次更新</small></div><div class="progress"><i style="width:${pct}%"></i></div><div class="between caption"><span>${detail}</span><span>${r.data_age_s!=null?num(r.data_age_s,0)+' 秒前更新':''}</span></div><div class="section two"><div><h3>每次更新用时</h3><div class="big">${num(speed,1)}<small>秒</small></div><p class="caption">${speed?'最近更新的平均用时':'完成首次更新后显示'}</p></div><div><h3>每小时训练速度</h3><div class="big">${num(speed>0?3600/speed:null,1)}<small>次</small></div><p class="caption">${speed&&budget?`按此速度，本轮剩余约 ${duration((budget-step)*speed)}`:'正在测量实际吞吐'}</p></div></div><div class="section"><div class="between"><h3>固定验证动作误差 · 越低越好</h3><span class="change ${improvement<0?'bad':''}">${improvement==null?'等待首次验证':(act.validation_measurements||0)<2?'已建立验证起点':improvement>=0?`较开始下降 ${num(improvement,1)}%`:`较开始上升 ${num(-improvement,1)}%`}</span></div><div class="big">${num(dev,4)}</div><div class="chart-wrap"><canvas id="chart${i}" aria-label="训练与固定验证动作误差曲线"></canvas></div><div class="legend"><span><i style="background:#346bbb"></i>训练动作误差</span><span><i style="background:#087c69"></i>固定验证误差</span></div><p class="caption">最近验证：${act.last_validation_step!=null?'第 '+act.last_validation_step+' 步':'尚未验证'}　·　任务闭环：${closed}<br>${Number.isFinite(assessment.best_dev_loss)?'最佳验证：'+num(assessment.best_dev_loss,4)+(assessment.best_dev_step!=null?'（第 '+assessment.best_dev_step+' 步）':'')+'<br>':''}${assessment.warmup_steps>0?(assessment.warmup_complete?'学习率预热已完成':'学习率预热 '+num(Math.min(step,assessment.warmup_steps),0)+' / '+num(assessment.warmup_steps,0)+' 步')+'　·　':''}${assessment.dev_windows!=null?'验证 '+num(assessment.dev_windows,0)+' 段序列<br>':''}最近保存：${act.last_checkpoint_step?num(act.last_checkpoint_step,0)+' 步':'尚未保存'}</p></div>${auxiliary(r,i)}${r.phase==='error'?`<div class="error">${esc(r.activity?.error||r.log?.last_error||'训练出现错误，请查看日志')}</div>`:''}</article>`;}).join('');
$('gpus').innerHTML='';
$('details').innerHTML=runs.map(r=>`<h3 style="margin-top:16px">${esc(r.platform)} · ${esc(r.run_id||'尚未启动')} · ${esc(r.owner||'Codex')}</h3><pre>${esc((r.log_tail||[]).join('\n')||'尚无日志')}</pre>`).join('');
runs.forEach((r,i)=>{draw($('chart'+i),r.series?.action||[],r.series?.dev||[]);auxSpecs.forEach(([key])=>draw($('aux-'+key+'-'+i),r.series?.[key]||[],[]));});
$('clock').textContent=snapshot.sampled_at_local?.replace(' CST','')||'';
}
function duration(s){if(s>=86400)return num(s/86400,1)+' 天';if(s>=3600)return num(s/3600,1)+' 小时';return num(s/60,0)+' 分钟';}
function draw(canvas,train,dev){if(!canvas)return;const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const all=[...train,...dev].filter(p=>p.length>=2&&p.every(Number.isFinite));if(!all.length){c.fillStyle='#849197';c.font='12px system-ui';c.fillText('产生数据后显示曲线',8,h/2);return;}let xmin=Math.min(...all.map(p=>p[0])),xmax=Math.max(...all.map(p=>p[0])),ymin=Math.min(...all.map(p=>p[1])),ymax=Math.max(...all.map(p=>p[1]));if(xmax===xmin)xmax=xmin+1;if(ymax-ymin<.0001){ymin-=.01;ymax+=.01;}const pad={l:40,r:8,t:10,b:24},xx=x=>pad.l+(x-xmin)/(xmax-xmin)*(w-pad.l-pad.r),yy=y=>pad.t+(ymax-y)/(ymax-ymin)*(h-pad.t-pad.b);c.font='10px system-ui';for(let j=0;j<3;j++){const y=ymin+(ymax-ymin)*j/2;c.strokeStyle='#edf0f1';c.beginPath();c.moveTo(pad.l,yy(y));c.lineTo(w-pad.r,yy(y));c.stroke();c.fillStyle='#849197';c.fillText(y.toFixed(2),1,yy(y)+3);}c.fillText(String(xmin),pad.l,h-3);c.textAlign='right';c.fillText(String(xmax),w-pad.r,h-3);c.textAlign='left';[[train,'#346bbb'],[dev,'#087c69']].forEach(([points,color])=>{const ps=points.filter(p=>p.every(Number.isFinite));if(!ps.length)return;c.strokeStyle=color;c.lineWidth=color==='#087c69'?2.5:1.3;c.globalAlpha=color==='#087c69'?1:.55;c.beginPath();ps.forEach((p,i)=>i?c.lineTo(xx(p[0]),yy(p[1])):c.moveTo(xx(p[0]),yy(p[1])));c.stroke();if(ps.length<100){c.fillStyle=color;ps.forEach(p=>{c.beginPath();c.arc(xx(p[0]),yy(p[1]),color==='#087c69'?3:1.5,0,Math.PI*2);c.fill();});}c.globalAlpha=1;});}
async function refresh(){try{const response=await fetch('/api/progress',{cache:'no-store'});if(!response.ok)throw Error(response.status);snapshot=await response.json();lastOkay=Date.now();$('connection').textContent='实时连接';$('dot').style.background='var(--green)';$('banner').hidden=true;render();}catch(error){$('connection').textContent='连接中断';$('dot').style.background='var(--orange)';$('banner').hidden=false;$('banner').textContent='暂时无法刷新。保留最后一次数据，稍后自动重试。';}}
$('refresh').addEventListener('click',refresh);addEventListener('resize',()=>snapshot&&render());document.addEventListener('visibilitychange',()=>!document.hidden&&refresh());setInterval(()=>{if(!document.hidden)refresh();},5000);refresh();
</script></body></html>
