; Codex-managed P2 r5 training, explicitly authorised by the user on 2026-10-16.
; Register with supervisor only when the user chooses to train. Both jobs stay STOPPED on load.
[program:owac-n02-v12-r5-raw]
directory=/workspace/owac/worktrees/n02-measurement-completion
command=/workspace/owac/worktrees/n02-measurement-completion/outputs/n02-full/runtime/py310-cu128/bin/python -m owac.training.n02_v12 --config configs/encoders/n02_v12/raw_n02_robotwin.json --seed 1103 --max-updates 1000 --run-id raw-n02-robotwin-r5-s1103 --output outputs/n02-v12/P2/raw-n02-robotwin-r5-s1103
environment=PYTHONPATH="/workspace/owac/worktrees/n02-measurement-completion/src:/workspace/owac/rawvla/source/starVLA",CUDA_VISIBLE_DEVICES="0",OMP_NUM_THREADS="4",MKL_NUM_THREADS="4"
autostart=false
autorestart=false
startretries=0
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/owac/worktrees/n02-measurement-completion/outputs/n02-v12/logs/r5-raw-robotwin.log
stderr_logfile=/workspace/owac/worktrees/n02-measurement-completion/outputs/n02-v12/logs/r5-raw-robotwin.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile_backups=2

[program:owac-n02-v12-r5-rgb]
directory=/workspace/owac/worktrees/n02-measurement-completion
command=/workspace/owac/worktrees/n02-measurement-completion/outputs/n02-full/runtime/py310-cu128/bin/python -m owac.training.n02_v12 --config configs/encoders/n02_v12/rgb_n02_robotwin.json --seed 1103 --max-updates 1000 --run-id rgb-n02-robotwin-r5-s1103 --output outputs/n02-v12/P2/rgb-n02-robotwin-r5-s1103
environment=PYTHONPATH="/workspace/owac/worktrees/n02-measurement-completion/src:/workspace/owac/rawvla/source/starVLA",CUDA_VISIBLE_DEVICES="1",OMP_NUM_THREADS="4",MKL_NUM_THREADS="4"
autostart=false
autorestart=false
startretries=0
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/owac/worktrees/n02-measurement-completion/outputs/n02-v12/logs/r5-rgb-robotwin.log
stderr_logfile=/workspace/owac/worktrees/n02-measurement-completion/outputs/n02-v12/logs/r5-rgb-robotwin.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile_backups=2
