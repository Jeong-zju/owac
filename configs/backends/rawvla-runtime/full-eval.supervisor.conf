# Frozen v3 evaluation; model services retain their loaded v2 snapshots.

[program:owac-rawvla-full-audit]
command=/workspace/owac/rawvla/envs/hub/bin/python -m owac.runtime.rawvla_eval_audit --watch --output /workspace/owac/rawvla/records/pi05-full-20261010-v3
directory=/workspace/owac/rawvla
environment=PYTHONPATH="/workspace/owac/rawvla/records/pi05-full-20261010-v3/frozen/src",PYTHONUNBUFFERED="1"
autostart=false
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/owac/rawvla/logs/owac-rawvla-full-audit.log
stdout_logfile_maxbytes=0
redirect_stderr=true

