; Template for the N01 v1.0 independent GPU runtime.
;
; Program naming rule: owac-n01-v1-<stage>-<run>
;   <stage>  P0 / P2 / P3 / P4 / P5 / P6 / P7 / P8
;   <run>    the run_id under research/n01-v1/runs/
; supervisor does not expand variables inside the program name, so replace the
; placeholders literally before registering this file on the server.
;
; Rules carried from docs/prompts/n01_v1_0/03_REMOTE_EXECUTION.md:
;   * one supervisor program per long task, foreground process, explicit Python
;   * logs written to the run outputs directory AND the supervisor log
;   * autostart=false / autorestart=false: a resumed job never silently restarts
;     from step 0; the run matrix decides the next identity
;   * stopasgroup/killasgroup so children die with the program
;   * never point PYTHONPATH at the frozen v2/v3 snapshots of other projects

[program:owac-n01-v1-<stage>-<run>]
command=/workspace/owac/rawvla/envs/encoder/bin/python -m owac.runtime.n01_full_preflight profile --config /workspace/owac/rawvla/research/n01-v1/runs/<run>/source/configs/encoders/n01_full/protocol_v1.json --output /workspace/owac/rawvla/research/n01-v1/runs/<run>/outputs/profile
directory=/workspace/owac/rawvla/research/n01-v1/runs/<run>/source
environment=PYTHONPATH="/workspace/owac/rawvla/research/n01-v1/runs/<run>/source/src",PYTHONUNBUFFERED="1",OMP_NUM_THREADS="8"
autostart=false
autorestart=false
startsecs=5
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/owac/rawvla/research/n01-v1/runs/<run>/outputs/supervisor-<stage>-<run>.log
stdout_logfile_maxbytes=0
redirect_stderr=true
