[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owac"
version = "0.1.0"
description = "Research infrastructure for general computational frameworks and RAW-native robotics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
simulation-data = ["numpy>=2.3,<3"]
# CPU-capable encoder stack for the N01/N02/N04 mechanism prototypes. Kept out of
# the core dependencies so `import owac` stays light; the RawVLA runtime (Python
# 3.10) is separate and never installs this extra.
encoder = ["numpy>=2.3,<3", "torch>=2.7.1,<2.10"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Mechanism prototypes run on CPU. This keeps ~5 GB of CUDA wheels out of the
# lock; a GPU host can re-lock without this source override.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "encoder" }]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "numpy>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"owac.runtime" = ["*.html"]
"owac.baselines" = ["sbi_embedding.LICENSE.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: tests spanning multiple OWAC components",
    "hardware: tests requiring explicitly configured physical devices",
    "gpu: tests requiring an available GPU runtime",
]
