[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owac"
version = "0.1.0"
description = "Research infrastructure for general computational frameworks and RAW-native robotics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
simulation-data = ["numpy>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "numpy>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: tests spanning multiple OWAC components",
    "hardware: tests requiring explicitly configured physical devices",
    "gpu: tests requiring an available GPU runtime",
]
