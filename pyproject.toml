[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owac"
version = "0.1.0"
description = "Research infrastructure for general computational frameworks and RAW-native robotics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
simulation-data = ["numpy>=2.3,<3"]
# Optional encoder-research runtime (N01/N02/N04).  Core `import owac` stays
# dependency-free: this extra is only needed by the encoder prototypes, their
# training/evaluation CLIs and tests.
encoder = ["numpy>=2.3,<3", "torch>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "numpy>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"owac.runtime" = ["*.html"]
"owac.baselines._vendor.rkn" = ["LICENSE", "provenance.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
# ConvNeXt 的 vendor 文件保持上游字节：任何重排都会改变 provenance.json 记录的
# upstream/local 差异，因此只对它免于格式化与风格检查（结构核查由测试完成）。
extend-exclude = ["src/owac/frameworks/n04/_vendor/convnext/convnext.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/owac/baselines/_vendor/rkn/*.py" = ["E501", "UP", "B028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: tests spanning multiple OWAC components",
    "hardware: tests requiring explicitly configured physical devices",
    "gpu: tests requiring an available GPU runtime",
]
