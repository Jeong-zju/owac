[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owac"
version = "0.1.0"
description = "Research infrastructure for general computational frameworks and RAW-native robotics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
policy-rpc = ["msgpack==1.1.2", "websockets==15.0.1"]
identity = ["h5py>=3"]
visualization = ["matplotlib>=3.9", "pillow>=11", "imageio>=2.36", "imageio-ffmpeg>=0.5"]
simulation-data = ["numpy>=2.3,<3"]
# Pure encoder research stack; the core package stays importable without it.
# The deployed RawVLA runtime is Python 3.10 and is not covered by this extra.
encoder = ["numpy>=2.3,<3", "torch==2.9.1", "scipy>=1.15,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "numpy>=2.3,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"owac.runtime" = ["*.html"]
"owac.baselines._vendor.rkn" = ["LICENSE", "provenance.json"]
"owac.frameworks.n04._vendor.convnext" = ["LICENSE", "provenance.json"]
"owac.baselines" = ["sbi_embedding.LICENSE.txt"]
"owac.baselines._vendor.dbsr" = ["LICENSE", "provenance.json"]
"owac.baselines._vendor.sea_raft" = ["LICENSE", "provenance.json", "*.py"]
"owac.baselines._vendor.sea_raft.utils" = ["*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "src/owac/frameworks/n02_full/components/upstream",
    "src/owac/frameworks/n04/_vendor/convnext/convnext.py",
    "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/owac/baselines/_vendor/rkn/*.py" = ["E501", "UP", "B028"]
"src/owac/baselines/_vendor/dbsr/*.py" = ["E501", "UP008", "UP032"] # Preserve upstream definitions.
# Preserve upstream SEA-RAFT definitions: only the declared vendor changes apply.
"src/owac/baselines/_vendor/sea_raft/*.py" = ["B007", "E501", "E712", "E722", "F401", "F811", "F841", "I001", "UP008", "UP034"]
"src/owac/baselines/_vendor/sea_raft/utils/*.py" = ["B007", "E501", "E712", "E722", "F401", "F811", "F841", "I001", "UP008", "UP034"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: tests spanning multiple OWAC components",
    "hardware: tests requiring explicitly configured physical devices",
    "gpu: tests requiring an available GPU runtime",
]

# Local numerical reference is CPU; the pinned StarVLA GPU runtime remains external.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
